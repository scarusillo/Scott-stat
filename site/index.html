<title>The Scott Stat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a consumer sports app. Brand header with six sections, pill sub-tabs, feed of cards; bottom tab bar on phones.
   Display numerals in a condensed scoreboard face; everything else in one modern sans. */
:root {
  --bg: #f4f5f9; --surface: #ffffff; --surface2: #f8f9fc; --ink: #0e1525; --muted: #5d667a; --faint: #8d95a6; --line: #e5e8ef;
  --accent: #f25c05; --accent2: #e8336d; --off: #f25c05; --def: #2563eb; --good: #13914a; --bad: #dc3b3b; --c3: #7c4ddb;
  --band: rgba(242,92,5,.10); --brand: linear-gradient(135deg, #ff8a00 0%, #f25c05 45%, #e8336d 100%);
  --shadow: 0 1px 2px rgba(14,21,37,.04), 0 6px 20px rgba(14,21,37,.06); --shadow-lg: 0 2px 4px rgba(14,21,37,.05), 0 18px 48px rgba(14,21,37,.10);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0d14; --surface: #121722; --surface2: #171d2a; --ink: #edf1f7; --muted: #9aa4b6; --faint: #6f7a8e; --line: #232b3a;
  --accent: #ff7a2e; --accent2: #ff5c8a; --off: #ff7a2e; --def: #6aa2ff; --good: #3ccf7c; --bad: #ff6b6b; --c3: #a98bff;
  --band: rgba(255,122,46,.14); --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0d14; --surface: #121722; --surface2: #171d2a; --ink: #edf1f7; --muted: #9aa4b6; --faint: #6f7a8e; --line: #232b3a;
  --accent: #ff7a2e; --accent2: #ff5c8a; --off: #ff7a2e; --def: #6aa2ff; --good: #3ccf7c; --bad: #ff6b6b; --c3: #a98bff;
  --band: rgba(255,122,46,.14); --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 10px 40px rgba(0,0,0,.45); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 28px; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 19px/1 var(--body); letter-spacing: -.02em; white-space: nowrap; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; color: #fff; font: 700 20px/1 var(--display); box-shadow: 0 4px 12px rgba(242,92,5,.35); }
nav { display: flex; gap: 2px; margin-left: auto; }
nav a { text-decoration: none; padding: 8px 14px; border-radius: 99px; color: var(--muted); font-weight: 600; font-size: 14px; }
nav a.on { color: var(--ink); background: var(--bg); }
nav a:hover { color: var(--ink); }
.tabbar { display: none; }
@media (max-width: 760px) {
  header nav { display: none }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; text-decoration: none; color: var(--faint); font-size: 10.5px; font-weight: 600; padding: 4px 0; }
  .tabbar a.on { color: var(--accent) }
  .tabbar svg { width: 22px; height: 22px; }
  main { padding-bottom: 96px !important }
}
nav a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr[tabindex]:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.subnav { display: flex; gap: 8px; overflow-x: auto; padding-block: 18px 2px; scrollbar-width: none; }
.subnav::-webkit-scrollbar { display: none }
.subnav a { flex: none; text-decoration: none; padding: 8px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 13.5px; box-shadow: var(--shadow); }
.subnav a.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
main { padding-block: 22px 72px; }
h1, h2, h3 { font-family: var(--body); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -.025em; }
h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 800; }
h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; }
h3 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.lede { max-width: 64ch; color: var(--muted); font-size: 16.5px; margin: 10px 0 0; }
.stack { display: grid; gap: 22px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good) } .neg { color: var(--bad) }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.controls label { display: grid; gap: 5px; font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
select, input[type=search], button { font: 500 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
button { cursor: pointer; font-weight: 600; } button:hover { border-color: var(--faint) }
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 99px; background: var(--ink); color: var(--surface); border: 0; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; border-radius: 99px; background: transparent; padding: 6px 14px; color: var(--muted); font-weight: 600; }
.seg button.on, .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 700; position: sticky; top: 0; background: var(--surface); }
th.l, td.l { text-align: left }
tbody tr { cursor: pointer; transition: background .12s } tbody tr:hover { background: var(--surface2) }
tbody tr:last-child td { border-bottom: 0 }
td.rank { color: var(--faint); width: 1%; font-weight: 700 }
.pm { color: var(--faint); font-size: 12px; margin-left: 3px }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface2); border-radius: 12px; padding: 12px 14px; border-top: 0; position: relative; }
.tile::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--line); }
.tile.o::before { background: var(--off) } .tile.d::before { background: var(--def) } .tile.a::before { background: var(--brand) }
.tile b { display: block; font: 600 32px/1.1 var(--display); font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile small { color: var(--muted); font-size: 12px; display: block; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
.big { font: 700 clamp(64px, 12vw, 104px)/.9 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: 28px; color: var(--muted); font-weight: 500; }
.split > *, .cols2 > *, .stack > * { min-width: 0 }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .split, .hero { grid-template-columns: 1fr } }
.barline { display: grid; grid-template-columns: 150px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
.track { position: relative; height: 10px; background: var(--surface2); border-radius: 99px; }
.track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--faint); }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; }
.prose { max-width: 72ch } .prose p { margin: 0 0 12px } .prose li { margin-bottom: 6px }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
svg text { fill: var(--muted); font: 11px var(--body); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 10px; font-size: 12px; z-index: 20; box-shadow: var(--shadow-lg); max-width: 320px; }
.flag { display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: var(--surface2); color: var(--muted); border: 1px solid var(--line); margin-left: 6px; }
/* avatars and people */
.who { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font: 700 12px/1 var(--body); letter-spacing: .02em; }
.duo { display: inline-flex; } .duo .av + .av { margin-left: -9px; box-shadow: 0 0 0 2px var(--surface); }
/* home */
.homehero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 18px 6px; }
@media (max-width: 860px) { .homehero { grid-template-columns: 1fr } }
.homehero h1 { font-size: clamp(36px, 6vw, 64px); letter-spacing: -.035em; }
.homehero h1 em { font-style: normal; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
@media (max-width: 520px) { .kpis { grid-template-columns: 1fr 1fr } .kpis div:last-child { grid-column: span 2 } }
.kpis div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpis b { display: block; font: 700 30px/1 var(--display); }
.kpis span { font-size: 12px; color: var(--muted); }
.stories { display: flex; gap: 16px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: none; }
.stories::-webkit-scrollbar { display: none }
.story { flex: none; display: grid; justify-items: center; gap: 6px; text-decoration: none; width: 78px; }
.story .ring { display: inline-grid; padding: 3px; border-radius: 50%; background: var(--brand); line-height: 0; }
.story .ring .av { width: 64px; height: 64px; font-size: 20px; box-shadow: 0 0 0 3px var(--surface); }
.story span { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; }
.story small { font-size: 11px; color: var(--faint); font-weight: 700; }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.post { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; text-decoration: none; transition: transform .15s, box-shadow .15s; }
.post:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.post .ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; font-size: 13px; font-weight: 700; }
.post .ph small { display: block; color: var(--faint); font-weight: 600; font-size: 11.5px; }
.post .pb { padding: 12px 16px 6px; display: grid; gap: 8px; align-content: start; }
.post .pb h3 { font-size: 19px; }
.post .stat { font: 700 56px/.95 var(--display); font-variant-numeric: tabular-nums; }
.post .stat small { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.post .pf { padding: 10px 16px 14px; font-size: 13px; font-weight: 700; color: var(--accent); }
.memo { background: var(--ink); color: var(--surface); border-radius: 20px; padding: 26px; display: grid; gap: 18px; box-shadow: var(--shadow-lg); }
.memo .eyebrow { color: #ffb37a }
.memo h2 { color: var(--surface); }
.memo .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.memo p { margin: 0; color: color-mix(in srgb, var(--surface) 78%, var(--ink)); font-size: 14.5px; }
.memo b { color: var(--surface) }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; counter-reset: s; }
.steps div { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.steps div::before { counter-increment: s; content: counter(s); display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; font-size: 13px; margin-bottom: 8px; }
.steps b { display: block; margin-bottom: 4px; }
.steps p { margin: 0; font-size: 13.5px; color: var(--muted); }
.about-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.about-nav a { font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 12px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); }
.about h2 { margin-top: 8px; scroll-margin-top: 90px; }
.about .panel p, .about .panel li { font-size: 15px; }
/* charts and tools added earlier */
.dot-g { fill: var(--off) } .dot-w { fill: var(--def) } .dot-b { fill: var(--c3) }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.key i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.lab { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 20px; }
@media (max-width: 860px) { .lab { grid-template-columns: 1fr } }
.pool { display: flex; flex-wrap: wrap; gap: 6px; max-height: 420px; overflow-y: auto; padding: 2px; align-content: flex-start; align-items: flex-start; }
.pchip { font-size: 13px; padding: 4px 10px 4px 4px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: grab; user-select: none; display: inline-flex; gap: 7px; align-items: center; font-weight: 600; }
.pchip .av { width: 24px; height: 24px; font-size: 10px; }
.pchip:hover { border-color: var(--accent) } .pchip:active { cursor: grabbing }
.pchip b { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--faint); font-size: 12px; }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.slot { min-height: 110px; border: 2px dashed var(--line); border-radius: 16px; padding: 12px; display: grid; align-content: space-between; gap: 6px; background: var(--surface2); }
.slot.over { border-color: var(--accent); background: var(--band); }
.slot.full { border-style: solid; background: var(--surface); box-shadow: var(--shadow); }
.slot .nm { font: 700 14px/1.15 var(--body); letter-spacing: -.01em; }
.slot .rt { font: 600 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.slot button { padding: 3px 10px; font-size: 12px; justify-self: start; border-radius: 99px; }
.grid5 { display: grid; gap: 3px; font-size: 12px; }
.grid5 div { padding: 7px 4px; text-align: center; border-radius: 6px; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease-out } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>

<header><div class="wrap bar">
  <a class="brand" href="#home"><span class="mark">S</span>Scott Stat</a>
  <nav id="nav" aria-label="Sections"><a href="#home" data-sec="home">Home</a><a href="#players" data-sec="players">Players</a><a href="#goat" data-sec="goat">GOAT</a><a href="#coaches" data-sec="coaches">Coaches</a><a href="#teammates" data-sec="teammates">Teammates</a><a href="#about" data-sec="about">About</a></nav>
</div></header>
<nav class="tabbar" id="tabbar" aria-label="Sections"><a href="#home" data-sec="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><a href="#players" data-sec="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Players</a><a href="#goat" data-sec="goat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>GOAT</a><a href="#coaches" data-sec="coaches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Coaches</a><a href="#teammates" data-sec="teammates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="9" r="3.2"/><path d="M2.5 20c.4-3.3 2.8-5 5.5-5s5.1 1.7 5.5 5M11 20c.4-3.3 2.8-5 5.5-5s5.1 1.7 5.5 5"/></svg>Teammates</a><a href="#about" data-sec="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>About</a></nav>
<div class="wrap"><nav class="subnav" id="subnav" aria-label="Views" hidden></nav></div>
<main class="wrap" id="app"><p class="note">Loading the Scott Stat…</p></main>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = (x, d = 1, sign = true) => x == null ? "–" : (sign && x > 0 ? "+" : "") + x.toFixed(d);
const cls = x => x == null ? "" : x > 0.05 ? "pos" : x < -0.05 ? "neg" : "";
const yr = y => `${y}-${String((y + 1) % 100).padStart(2, "0")}`;
let D = null;
const state = { tier: "plus", sort: "scott", q: "", minPoss: 30000, csort: "net", fseason: null, ftype: "", a: null, b: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("scott-ui") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("scott-ui", JSON.stringify(state)); } catch (e) {} };

fetch("data.json").then(r => r.json()).then(d => { D = d; D.byId = new Map(D.players.map(p => [String(p.id), p]));
  D.cById = new Map(D.classic.map(p => [p.id, p])); route(); })
  .catch(() => { $("#app").innerHTML = `<p class="note">The data file didn't load. Reload the page to try again.</p>`; });
addEventListener("hashchange", route);

function route() {
  let h = location.hash.slice(1) || "home";
  if (h === "players") h = "leaders"; else if (h === "goat") h = "legacy"; else if (h === "teammates") h = "synergy";
  const view = h.split("-")[0];
  const sec = h.startsWith("player-") || h.startsWith("legend-") ? "players" : VIEW_SEC[view] || "home";
  document.querySelectorAll("[data-sec]").forEach(a => a.classList.toggle("on", a.dataset.sec === sec));
  const sub = $("#subnav"), vs = SECTIONS[sec];
  sub.hidden = vs.length < 2;
  sub.innerHTML = vs.map(([k, l]) => `<a href="#${k}" class="${k === view ? "on" : ""}">${l}</a>`).join("");

const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => { const w = String(n).replace(/[^\p{L}\s'-]/gu, "").trim().split(/\s+/); return ((w[0]?.[0] || "") + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); };

function legacyRank(W = { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 0.5 }) {
  const pool = D.classic.filter(p => p.seasons >= 8 && p.pwar5 != null);
  const stat = k => { const top = pool.map(p => p[k] ?? 0).sort((a, b) => b - a).slice(0, 10), ref = top.reduce((a, b) => a + b, 0) / top.length;
    return p => 100 * Math.max(0, p[k] ?? 0) / ref; };
  const zp = stat("pwar5"), zc = stat("war"), zr = stat("tshare"), zs = stat("create5"), zw = stat("winwins");
  const tot = W.peak + W.career + W.rings + W.scoring + W.winning;
  return pool.map(p => ({ p, score: (W.peak * zp(p) + W.career * zc(p) + W.rings * zr(p) + W.scoring * zs(p) + W.winning * zw(p)) / tot }))
    .sort((a, b) => b.score - a.score);
}

/* ---------- about ---------- */
function about() {
  const v = D.validation?.classic || {};
  const r = k => v[k]?.r_net != null ? v[k].r_net.toFixed(2) : "–";
  const toc = [["question", "The question"], ["rating", "How a rating is built"], ["wins", "From points to wins"], ["winning", "Winning beyond the box score"], ["titles", "Championships"],
    ["legacy", "The all-time ranking"], ["coaches", "Coaches"], ["synergy", "Synergy"], ["eras", "Fair across eras"], ["proof", "Does it work?"], ["limits", "What it can't do"], ["data", "Data"]];
  $("#app").innerHTML = `<div class="stack about" style="gap:26px">
    <div><div class="eyebrow">About the Scott Stat</div><h1>A stat for what wins, not what fills a box score</h1>
      <p class="lede">Points, rebounds and assists say what a player did. They don't say whether his team was better for it. The Scott Stat answers that one question for every player since 1951-52, on one scale, and shows the work behind every number.</p></div>
    <nav class="about-nav" aria-label="On this page">${toc.map(([k, l]) => `<a href="javascript:void(0)" data-jump="${k}">${l}</a>`).join("")}</nav>

    <h2 id="a-question">The question</h2>
    <div class="panel prose"><p>When this player is on the floor, how much better is his team, in points per 100 possessions, compared with an average player in his place? +5 is All-NBA. +7 and up is an MVP season. Zero is average; about -2 is a player any team could sign off the street.</p>
      <p>Two players with the same stat line can be worth very different amounts. One scores efficiently, defends, and makes his teammates better; the other takes the same shots on a team that loses more when he plays. The Scott Stat is built to tell them apart.</p></div>

    <h2 id="a-rating">How a rating is built</h2>
    <div class="steps">
      <div><b>Play-by-play (1996-97 on)</b><p>Every stretch of game with the same ten players on the floor. A regression splits each lineup's margin among its players, with luck taken out of three-point and free-throw shooting.</p></div>
      <div><b>Box score + team results (every era)</b><p>Each stat gets a price learned from the play-by-play era (an assist, a steal, a missed shot), matched to its era. Then the gap between how good the team was and what its players' stats add up to is shared out by minutes.</p></div>
      <div><b>Game logs</b><p>Every game since 1946-47: how the team did with and without him. This sharpens the older eras, where there's no play-by-play.</p></div>
      <div><b>One rating per season</b><p>From 1996-97 the play-by-play decides who on a team gets the credit; the team's results decide how much there is.</p></div>
    </div>
    <div class="panel prose"><p>The ABA (1967-76) is included. Its stars are discounted more than its role players, because the players who switched leagues show the ABA stretched the gap: an ABA +6 played like an NBA +3.9 the next season.</p></div>

    <h2 id="a-wins">From points to wins</h2>
    <div class="panel prose"><p>A rating times the minutes he played, measured against a replacement-level player, converted with the league's own curve from point margin to wins. Peak wins per season uses a neutral setting: a standard 100 possessions a game over 82 games, with minutes measured against his era's norm. Pace and 48-minute nights are traits of an era, not of a player, so a 1962 season and a 2016 season count the same.</p></div>

    <h2 id="a-winning">Winning beyond the box score</h2>
    <div class="panel prose"><p>For every team-season since 1951-52: how much better was the team than its players' box scores say? One number per player, fitted across all of them at once, so it's identified by players changing teams. A player whose teams outperform on every roster he joins gets the credit (Duncan, Russell, Bird, Garnett, LeBron); one whose teams fall short everywhere gets the blame. This is where defense, spacing and lifting teammates show up.</p></div>

    <h2 id="a-titles">Championships</h2>
    <div class="panel prose"><p>Each title is split among the champion's players by how much each raised the team's title odds in those playoffs, using his playoff rating. The best player on a champion typically gets 60-85% of it: Jordan 84% of the 1991 title, Hakeem 85% of 1994, LeBron 88% of 2016. A title in a 30-team league counts more than one in an 8-team league.</p></div>

    <h2 id="a-legacy">The all-time ranking</h2>
    <div class="panel prose"><p>Four ingredients, each measured at a player's best and scored against the all-time top-10 level: <b>peak</b> (wins per season, best five), <b>championships</b>, <b>scoring and creation</b> (offensive load, half weight) and <b>winning beyond the box score</b> (half weight). Longevity is off by default; the reader can turn it on. Every player shows his rank range across 81 weightings, so you can see which rankings depend on the weights and which don't.</p></div>

    <h2 id="a-coaches">Coaches</h2>
    <div class="panel prose"><p>A coach gets credit only when players play above their own career level and aging curve under him, learned from every player who moved between coaches. The coach lab shows each player's growth under each coach, filterable by position and play style, and ranks coaches for any type of player. These are small, damped numbers: a lead for a scout, not a verdict.</p></div>

    <h2 id="a-synergy">Synergy</h2>
    <div class="panel prose"><p>When two teammates share the floor, does the team do better than their individual ratings say? Synergy is that gap, shrunk toward zero by an amount chosen to best predict each pair's other seasons. It's real but noisy for any one pair (split-half r ${D.syn.reliability}), so long partnerships are the ones to trust.</p></div>

    <h2 id="a-eras">Fair across eras</h2>
    <div class="panel prose"><p>The test: in each decade, do players' ratings add up to how good their teams actually were? An equal answer in every era means one scale. Today the slope runs 1.07 to 1.13 in every decade from the 1950s to the 2020s. Older eras that recorded fewer stats are corrected for the information they're missing, within teams, so no era is pulled toward average just because less was written down.</p></div>

    <h2 id="a-proof">Does it work?</h2>
    <div class="tiles">
      <div class="tile a"><small>Box score + team, unseen seasons</small><b>${r("test_classic")}</b><small>correlation with play-by-play impact</small></div>
      <div class="tile"><small>Basketball-Reference BPM</small><b>${r("test_bref_bpm")}</b><small>same test</small></div>
      <div class="tile"><small>Box score alone</small><b>${r("test_box_only")}</b><small>same test</small></div>
      <div class="tile"><small>Next season from roster changes</small><b>0.85</b><small>team results predicted, 1,358 team-seasons</small></div>
    </div>
    <div class="panel prose"><p>Every layer was kept only if it improved prediction on seasons it never saw. Several were tried and removed: a scorer bonus that didn't hold up, and a winning adjustment that counted the same thing twice. The full audit log is under Method &amp; tests.</p></div>

    <h2 id="a-limits">What it can't do</h2>
    <div class="panel prose"><ul><li>Before 1996-97 there's no play-by-play, so Jordan's, Magic's and Bird's primes are estimates from box scores, team results and game logs, with wider error bars.</li>
      <li>Before 1973-74 steals, blocks and turnovers weren't recorded, so Russell's and Wilt's defense is seen mostly through their teams' results.</li>
      <li>Synergy and coach effects are small and noisy for any single pair; the tool shows the error on each.</li>
      <li>The all-time ranking is a choice of weights. The site shows the choice and lets you change it.</li></ul></div>

    <h2 id="a-data">Data</h2>
    <div class="panel prose"><p>Play-by-play for every game since 1996-97; Basketball-Reference season tables for every NBA and ABA season since 1951-52; every box score since 1946-47 from game logs; head coaches for every game; player salaries since 2009-10. The code is open: <a href="https://github.com/scarusillo/Scott-stat" style="color:var(--accent);font-weight:700">github.com/scarusillo/Scott-stat</a>.</p></div>
  </div>`;
  document.querySelectorAll("[data-jump]").forEach(a => a.onclick = () => document.getElementById("a-" + a.dataset.jump)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
}

/* ---------- charts ---------- */
function seasonChart(seasons, opts = {}) {
  // seasons: [{season, net, se, team, extra}]
  if (!seasons.length) return "";
  const W = 720, Hh = 230, m = { l: 36, r: 12, t: 12, b: 26 };
  const xs = seasons.map(s => s.season), lo = Math.min(...xs), hi = Math.max(...xs);
  const vals = seasons.flatMap(s => [s.net - (s.se || 0), s.net + (s.se || 0), s.plus ?? s.net]);
  let ymin = Math.min(-2, Math.floor(Math.min(...vals))), ymax = Math.max(6, Math.ceil(Math.max(...vals)));
  const X = v => m.l + (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (W - m.l - m.r);
  const Y = v => m.t + (ymax - v) / (ymax - ymin) * (Hh - m.t - m.b);
  const ticks = []; for (let v = Math.ceil(ymin / 2) * 2; v <= ymax; v += 2) ticks.push(v);
  const band = seasons.filter(s => s.se != null);
  const area = band.length > 1 ? `<path d="M${band.map(s => `${X(s.season)},${Y(s.net + s.se)}`).join("L")}L${band.slice().reverse().map(s => `${X(s.season)},${Y(s.net - s.se)}`).join("L")}Z" fill="var(--band)" stroke="none"/>` : "";
  const line = `<path d="M${seasons.map(s => `${X(s.season)},${Y(s.net)}`).join("L")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const plusLine = opts.plus && seasons.filter(s => s.plus != null).length > 1 ? `<path d="M${seasons.filter(s => s.plus != null).map(s => `${X(s.season)},${Y(s.plus)}`).join("L")}" fill="none" stroke="var(--def)" stroke-width="2" stroke-dasharray="4 3"/>` : "";
  const xt = []; const step = Math.max(1, Math.ceil((hi - lo) / 8)); for (let v = lo; v <= hi; v += step) xt.push(v);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:420px" role="img" aria-label="Impact by season">
    ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`).join("")}
    ${xt.map(v => `<text x="${X(v)}" y="${Hh - 6}" text-anchor="middle">${String(v).slice(2)}-${String((v + 1) % 100).padStart(2, "0")}</text>`).join("")}
    ${area}${plusLine}${line}
    ${seasons.map(s => `<circle cx="${X(s.season)}" cy="${Y(s.net)}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" data-tip="${esc(`${yr(s.season)} ${s.team || ""}: ${f(s.net)}${s.se != null ? " ±" + s.se.toFixed(1) : ""}${s.plus != null ? " · Plus " + f(s.plus) : ""}${s.extra || ""}`)}"/>`).join("")}
  </svg></div>`;
}
function hbar(label, v, max, color, se) {
  const w = Math.min(50, Math.abs(v ?? 0) / max * 50);
  return `<div class="barline"><span>${label}</span><div class="track"><div class="zero"></div>
    <div class="fill" style="background:${color};${(v ?? 0) >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`}"></div></div>
    <span class="num ${cls(v)}" style="text-align:right">${f(v)}${se ? `<span class="pm">±${se.toFixed(1)}</span>` : ""}</span></div>`;
}
document.addEventListener("mousemove", e => { const t = e.target.closest?.("[data-tip]"); const tip = $("#tip");
  if (t) { tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - 240) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
  else tip.hidden = true; });

/* ---------- player page (Plus) ---------- */
function explain(p) {
  const parts = [];
  const big = (p.off ?? 0) >= (p.def ?? 0) ? "offense" : "defense";
  parts.push(`${esc(p.name)} adds ${f(p.impact)} points per 100 possessions over an average player, mostly on ${big} (offense ${f(p.off)}, defense ${f(p.def)}).`);
  if (p.lift != null) parts.push(p.lift > 1 ? `About ${f(p.lift, 1, false)} of it doesn't show up in his own stats: his teammates play better and his team defends better while he's out there. That's lift.`
    : p.lift < -1 ? `His own stats overstate him by ${f(-p.lift, 1, false)}: his team does worse than his box score suggests when he plays. A production-first player.`
    : `His impact lines up with his own stats: what you see in the box score is about what the team gets.`);
  if (p.clutch != null && p.clutch_se) parts.push(Math.abs(p.clutch) > 1.5 * p.clutch_se ? `In the clutch he plays ${p.clutch > 0 ? "better" : "worse"} than his usual self (${f(p.clutch)} ±${p.clutch_se.toFixed(1)}), one of the few clear clutch signals in the data.`
    : `His clutch number (${f(p.clutch)} ±${p.clutch_se.toFixed(1)}) is within noise; for most players clutch isn't a separate skill.`);
  if (p.po != null && p.po_se) parts.push(Math.abs(p.po) > 1.5 * p.po_se ? `In the playoffs he plays ${p.po > 0 ? "above" : "below"} his regular-season level (${f(p.po)}).` : "");
  return parts.filter(Boolean).join(" ");
}

  const all = [...D.classic.map(p => ({ key: "c:" + p.id, label: p.name + " (Classic)", p, tier: "classic" })),
               ...D.players.map(p => ({ key: "p:" + p.id, label: p.name + " (Plus)", p, tier: "plus" }))].sort((a, b) => a.label.localeCompare(b.label));
  const find = k => all.find(x => x.key === k);
  if (!state.a) state.a = all.find(x => x.label === "Michael Jordan (Classic)")?.key;
  if (!state.b) state.b = all.find(x => x.label === "LeBron James (Classic)")?.key;

  const metrics = [["Peak (best 5)", "best5"], ["Best season", "best"], ["Career impact", "impact"], ["Offense", "off"], ["Defense", "def"], ["Own production", "prod"], ["Lift", "lift"], ["Career wins", "war"]];
  const plusOnly = [["Scott Stat", "scott"], ["Clutch rise", "clutch"], ["Playoff rise", "po"]];
  const opt = sel => all.map(x => `<option value="${x.key}" ${x.key === sel ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  const row = ([l, k]) => { const a = A?.p[k], b = B?.p[k]; const w = a != null && b != null ? (a > b ? 0 : b > a ? 1 : -1) : -1;
    return `<tr><td class="l">${l}</td><td class="num" style="${w === 0 ? "font-weight:700" : ""}">${k === "war" ? f(a, 0, false) : f(a)}</td><td class="num" style="${w === 1 ? "font-weight:700" : ""}">${k === "war" ? f(b, 0, false) : f(b)}</td></tr>`; };
  const same = A && B && A.tier === B.tier;
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Compare</div><h1>Head to head</h1>

    <div class="controls"><label for="ca">Player A<select id="ca">${opt(state.a)}</select></label><label for="cb">Player B<select id="cb">${opt(state.b)}</select></label></div>
    ${same ? "" : `<p class="flag">Different tiers: Classic reads lower at the very top</p>`}
    <div class="panel tablewrap"><table><thead><tr><th class="l"></th><th>${esc(A?.p.name)}</th><th>${esc(B?.p.name)}</th></tr></thead>
      <tbody>${(A?.tier === "plus" && B?.tier === "plus" ? plusOnly : []).map(row).join("")}${metrics.map(row).join("")}</tbody></table></div>
    <div class="cols2">${[A, B].map(X => X ? `<div class="panel"><h3>${esc(X.p.name)}</h3>${seasonChart(X.tier === "plus" ? X.p.s.map(s => ({ season: s[0], team: s[1], net: s[2], se: s[3] })) : X.p.s.map(s => ({ season: s[0], team: s[1], net: s[2], plus: s[6] })), { plus: X.tier === "classic" })}</div>` : "").join("")}</div></div>`;
  $("#ca").onchange = e => { state.a = e.target.value; save(); compare(); };
  $("#cb").onchange = e => { state.b = e.target.value; save(); compare(); };
}

/* ---------- GM finder ---------- */
function finder() {
  const seasons = [...new Set(D.recent.map(r => r[2]))].sort();
  if (!state.fseason || !seasons.includes(state.fseason)) state.fseason = seasons[seasons.length - 1];
  const types = [...new Set(D.recent.map(r => r[12]).filter(Boolean))].sort();
  const rows = D.recent.filter(r => r[2] === state.fseason && (!state.ftype || r[12] === state.ftype));
  const W = 720, Hh = 330, m = { l: 40, r: 14, t: 14, b: 34 };
  const xs = rows.map(r => r[10] ?? 0), ys = rows.map(r => r[4]);
  const xmax = Math.ceil(Math.max(30, ...xs) / 5) * 5, ymin = Math.floor(Math.min(-4, ...ys)), ymax = Math.ceil(Math.max(8, ...ys));
  const X = v => m.l + v / xmax * (W - m.l - m.r), Y = v => m.t + (ymax - v) / (ymax - ymin) * (Hh - m.t - m.b);
  const hidden = rows.filter(r => r[9] != null).sort((a, b) => b[9] - a[9]).slice(0, 15);

function tierChart(list, se) {

  const X = v => m.l + Math.max(0, v) / mx * (W - m.l - m.r), lead = list[0].best5;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:480px" role="img" aria-label="All-time peaks with margins of error">
    ${[0, 2, 4, 6, 8].map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t - 4}" y2="${Hh - m.b}" stroke="var(--line)"/><text x="${X(t)}" y="12" text-anchor="middle">+${t}</text>`).join("")}
    <rect x="${X(lead - se)}" y="${m.t - 4}" width="${X(lead) - X(lead - se)}" height="${Hh - m.t - m.b + 4}" fill="var(--band)"/>
    ${list.map((p, i) => { const y = m.t + i * rowH, ind = Math.max(0, p.ind ?? 0), tc = p.team ?? 0;
      return `<text x="${m.l - 8}" y="${y + 17}" text-anchor="end" style="fill:var(--ink);font-size:13px;font-weight:${p.best5 >= lead - se ? 600 : 400}">${esc(p.name)}</text>
      <rect x="${X(0)}" y="${y + 6}" width="${X(ind) - X(0)}" height="14" fill="var(--muted)" data-tip="${esc(`${p.name}: individual ${f(p.ind, 2)}`)}"/>
      <rect x="${tc >= 0 ? X(ind) : X(ind + tc)}" y="${y + 6}" width="${Math.abs(X(ind + tc) - X(ind))}" height="14" fill="${tc >= 0 ? "var(--accent)" : "var(--bad)"}" data-tip="${esc(`${p.name}: team credit ${f(tc, 2)}`)}"/>
      <line x1="${X(p.best5 - se)}" x2="${X(p.best5 + se)}" y1="${y + 13}" y2="${y + 13}" stroke="var(--ink)" stroke-width="1.5"/>
      <line x1="${X(p.best5 - se)}" x2="${X(p.best5 - se)}" y1="${y + 8}" y2="${y + 18}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(p.best5 + se)}" x2="${X(p.best5 + se)}" y1="${y + 8}" y2="${y + 18}" stroke="var(--ink)" stroke-width="1.5"/>
      <text x="${W - m.r + 8}" y="${y + 17}" style="fill:var(--ink);font-size:12px">${f(p.best5, 2)}</text>`; }).join("")}
  </svg></div>`;
}

    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:480px" role="img" aria-label="Coaches: players' production against players' lift">

    </svg></div>

      <div class="tablewrap"><div class="eyebrow">Best for players' lift</div><table><tbody>${cs.slice().sort((a, b) => b.indlift_s - a.indlift_s).slice(0, 7).map(c => `<tr><td class="l">${esc(c.name)}</td><td class="num pos">${f(c.indlift, 2)}</td><td class="num"><span class="pm">${c.dev_n} seasons</span></td></tr>`).join("")}</tbody></table></div></div></div>

  <div class="panel tablewrap"><h3>7 · Style × player type, tested honestly</h3>

/* ---------- legacy: peak + career + championships, reader-weighted ---------- */
function legacy() {
  const W = { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 0.5, ...(state.lw4 || {}) };
  const pool = D.classic.filter(p => p.seasons >= 8 && p.pwar5 != null);
  // each ingredient as a percentage of the all-time top-10 level, so equal weights are equal at the top
  // (z-scores let championships count ~3x: most players have none, so anyone with several looked extreme)
  const stat = k => { const top = pool.map(p => p[k] ?? 0).sort((a, b) => b - a).slice(0, 10), ref = top.reduce((a, b) => a + b, 0) / top.length;
    return p => 100 * Math.max(0, p[k] ?? 0) / ref; };
  const zp = stat("pwar5"), zc = stat("war"), zr = stat("tshare"), zs = stat("create5"), zw = stat("winwins");
  const tot = W.peak + W.career + W.rings + W.scoring + W.winning || 1;
  const rows = pool.map(p => ({ p, score: (W.peak * zp(p) + W.career * zc(p) + W.rings * zr(p) + W.scoring * zs(p) + W.winning * zw(p)) / tot }))
    .sort((a, b) => b.score - a.score).slice(0, 40);
  // how much does the choice of weights matter? rank under 81 weightings: peak, titles, scoring & creation and
  // winning each at half, equal or double their default (career value kept at the reader's setting)
  const Z = pool.map(p => [p.id, zp(p), zc(p), zr(p), zs(p), zw(p)]), range = new Map(pool.map(p => [p.id, [999, 0]]));
  for (const a of [0.5, 1, 2]) for (const c of [0.5, 1, 2]) for (const e of [0.5, 1, 2]) for (const g of [0.5, 1, 2])
    Z.map(z => [z[0], a * W.peak * z[1] + W.career * z[2] + c * W.rings * z[3] + e * W.scoring * z[4] + g * W.winning * z[5]]).sort((x, y) => y[1] - x[1])
      .forEach(([id], i) => { const r = range.get(id); r[0] = Math.min(r[0], i + 1); r[1] = Math.max(r[1], i + 1); });
  const presets = [["Default (on-court, no longevity)", { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 0.5 }], ["No scoring & creation", { peak: 1, career: 0, rings: 1, scoring: 0, winning: 0.5 }],
                   ["Titles count double", { peak: 1, career: 0, rings: 2, scoring: 0.5, winning: 0.5 }], ["Winning full weight", { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 1 }],
                   ["Add longevity", { peak: 1, career: 1, rings: 1, scoring: 0.5, winning: 0.5 }], ["No titles", { peak: 1, career: 0, rings: 0, scoring: 0.5, winning: 0.5 }]];
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">All-time · 1951-52 to 2025-26</div><h1>Greatest of all time, your weights</h1>
    <p class="lede">Who was best on the court, and who won the most? Every default ingredient measures a player at his best, per season, so a long career earns nothing by itself; career totals are an optional dial. Scoring &amp; creation and winning count half by default: both overlap with impact, which already includes what his scoring did for his team and part of his team's results.</p></div>
    <div class="cols2">
      <div class="panel prose"><h3>The ingredients</h3><ul>
        <li><b>Peak:</b> wins added per season over his best five straight seasons: impact per possession x his minutes relative to his era's norm, at a standard 100 possessions a game over 82 games (era-neutral: a fast pace or a 44-minute era doesn't count).</li>
        <li><b>Career value (off by default):</b> total wins added above a replacement player, every season. This is longevity: add it if you think lasting should count.</li>
        <li><b>Championships:</b> every title split among that team's players by how much each raised the team's title odds in those playoffs (his playoff rating, not his regular season), then adjusted for league size (a title among 30 teams counts more than one among 8). The best player on a champion typically gets 60-75% of that title; a second option about 20-25%.</li>
        <li><b>Scoring &amp; creation:</b> how much offense he carried: points, plus 1.1 points per assist (a basket worth about 2.2, half credited to the passer), plus half a possession's worth per offensive rebound (a new possession, same split), per 100 team possessions above an average player in his minutes, best five straight seasons, relative to his league and era. Impact already counts what this did for winning; this ingredient values the load itself.</li>
        <li><b>Winning:</b> did his teams win more than their box scores said they should? Fitted jointly over every NBA team-season since 1951-52, so it is identified by players changing teams: a player whose teams outperform on every roster he joins gets the credit; one whose teams fall short everywhere gets the blame. Counted as wins per season beyond the box score, in his prime (his ten best seasons), with no credit for career length. This is where defense, spacing, screening and lifting (or dragging) teammates show up.</li></ul></div>

      ${rows.map((r, i) => `<tr tabindex="0" data-go="#legend-${r.p.id}"><td class="rank num">${i + 1}</td><td class="l">${who(r.p.name)}</td><td class="l num">${r.p.first}–${String(r.p.last + 1).slice(2)}</td>

/* ---------- shared: multi-line chart ---------- */
function lineChart(series, o = {}) {
  const W = 720, Hh = o.h || 260, m = { l: 38, r: 12, t: 12, b: 30 };
  const all = series.flatMap(s => s.pts); if (!all.length) return "";
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.floor(Math.min(o.ymin ?? 0, ...ys)), y1 = Math.ceil(Math.max(o.ymax ?? 0, ...ys));
  const X = v => m.l + (v - x0) / (x1 - x0 || 1) * (W - m.l - m.r), Y = v => m.t + (y1 - v) / (y1 - y0 || 1) * (Hh - m.t - m.b);
  const yt = []; const st = (y1 - y0) > 8 ? 2 : 1; for (let v = y0; v <= y1; v += st) yt.push(v);
  const xt = []; const xs2 = Math.max(1, Math.ceil((x1 - x0) / 10)); for (let v = Math.ceil(x0); v <= x1; v += xs2) xt.push(v);
  return `<div class="chips" style="margin:6px 0">${series.map(s => `<span class="chip" style="border-color:${s.color};color:var(--ink)"><span style="display:inline-block;width:14px;border-top:2px ${s.dash ? "dashed" : "solid"} ${s.color};vertical-align:middle;margin-right:5px"></span>${esc(s.name)}</span>`).join("")}</div>

    ${o.band ? `<rect x="${X(Math.max(x0, o.band[0]))}" y="${m.t}" width="${Math.max(0, X(Math.min(x1, o.band[1])) - X(Math.max(x0, o.band[0])))}" height="${Hh - m.t - m.b}" fill="var(--band)"/>` : ""}
    ${yt.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`).join("")}
    ${xt.map(v => `<text x="${X(v)}" y="${Hh - 12}" text-anchor="middle">${v}</text>`).join("")}
    <text x="${(W + m.l) / 2}" y="${Hh - 1}" text-anchor="middle">${esc(o.xlabel || "")}</text>
    ${series.map(s => `<path d="M${s.pts.map(p => `${X(p[0])},${Y(p[1])}`).join("L")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>` +
      (s.dots === false ? "" : s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2" data-tip="${esc(`${s.name}, ${o.xname || "age"} ${p[0]}: ${f(p[1])}${p[2] ? " · " + p[2] : ""}`)}"/>`).join(""))).join("")}

function renderCoachFinder() {
  const q = state.cf || { pos: "G", sty: "" };

  const by = new Map();
  rows.forEach(x => { const a = by.get(x.coach) || []; a.push(x); by.set(x.coach, a); });

    const w = a.reduce((s, x) => s + x.poss, 0), v = a.reduce((s, x) => s + x.v * x.poss, 0) / w;
    const se = Math.sqrt(a.reduce((s, x) => s + (x.poss * x.se) ** 2, 0)) / w;

      <label for="cfsty">Play style<select id="cfsty"><option value="">Every style</option>${STYLES.map(t => `<option ${t === q.sty ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>
    ${out.length ? `<div class="tablewrap"><table><thead><tr><th></th><th class="l">Coach</th><th>Growth</th><th>Players</th><th class="l">Grew most</th></tr></thead><tbody>
      ${out.slice(0, 15).map((r, i) => `<tr data-coach="${esc(r.coach)}" tabindex="0"><td class="rank num">${i + 1}</td><td class="l"><b>${esc(r.coach)}</b></td><td class="num ${cls(r.v)}"><b>${f(r.v, 2)}</b><span class="pm">±${r.se.toFixed(2)}</span></td>
        <td class="num">${r.n}</td><td class="l">${esc(r.best.n)} <span class="pm">${f(r.best.v, 2)}</span></td></tr>`).join("")}</tbody></table></div>
      <p class="note">${esc(label[0].toUpperCase() + label.slice(1))}: ${out.length} coaches qualify. Click a coach to open his lab.</p>`
      : `<p class="note">No coach has three or more ${esc(label)} with enough minutes. Widen the filters.</p>`}`;
  const set = k => v => { state.cf = { ...q, [k]: v }; save(); renderCoachFinder(); };
  document.querySelectorAll("[data-cfpos]").forEach(b => b.onclick = () => set("pos")(b.dataset.cfpos));
  $("#cfsty").onchange = e => set("sty")(e.target.value);
  document.querySelectorAll("tr[data-coach]").forEach(tr => { const go = () => { const c = D.coaches.find(x => x.name === tr.dataset.coach); if (c) { state.cl = c.id; save(); coachlab(); scrollTo(0, 0); } };
    tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); }; });
}

/* ---------- synergy ---------- */
function synKey(a, b) { return a < b ? a + "-" + b : b + "-" + a; }
function synergy() {
  const S = state.syn || { mode: "duo", q: "", min: 3000, team: "", gems: false, sort: "total" };
  const pk = id => D.byId.get(String(id))?.peak5 ?? 0;
  const gem = (a, b) => Math.max(pk(a), pk(b)) < 1.5 || (Math.max(pk(a), pk(b)) >= 3 && Math.min(pk(a), pk(b)) < 1.5);
  const teams = [...new Set(D.syn.pairs.flatMap(p => p[4].split("/")))].sort();
  const K = D.syn.k;
  let rows, isTrio = S.mode === "trio";
  if (!isTrio) {
    rows = D.syn.pairs.map(p => ({ ids: [p[0], p[1]], names: [p[2], p[3]], team: p[4], a: p[5], z: p[6], poss: p[7], syn: p[8], net: p[9] }));
  } else {
    rows = D.syn.trios.map(p => ({ ids: [], names: [p[0], p[1], p[2]], team: p[3], a: p[4], z: p[5], poss: p[6], syn: p[7], net: p[8] }));
  }
  rows.forEach(r => { r.total = r.syn * r.poss / 100; r.se = 13 / Math.sqrt(r.poss + K); });
  const ql = S.q.trim().toLowerCase();
  rows = rows.filter(r => r.poss >= S.min && (!S.team || r.team.split("/").includes(S.team)) && (!ql || r.names.some(n => n.toLowerCase().includes(ql)))
    && (!S.gems || isTrio || gem(r.ids[0], r.ids[1])));
  rows.sort((a, b) => S.sort === "rate" ? b.syn - a.syn : b.total - a.total);
  const top = rows.slice(0, 50), worst = rows.slice().sort((a, b) => S.sort === "rate" ? a.syn - b.syn : a.total - b.total).slice(0, 10);
  // scatter: possessions together (log) vs synergy
  const W = 720, Hh = 300, m = { l: 44, r: 14, t: 14, b: 36 };
  const pts = rows;
  const xs = pts.map(r => Math.log10(r.poss)), x0 = Math.log10(S.min), x1 = Math.max(x0 + 0.5, ...xs);
  const ylim = Math.max(1, Math.ceil(Math.max(...pts.map(r => Math.abs(r.syn)), 1)));
  const X = v => m.l + (Math.log10(v) - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (ylim - v) / (2 * ylim) * (Hh - m.t - m.b);
  const xt = [1000, 2000, 5000, 10000, 20000, 50000].filter(v => Math.log10(v) >= x0 - 1e-9 && Math.log10(v) <= x1 + 1e-9);
  const yt = []; for (let v = -ylim; v <= ylim; v += ylim > 2 ? 1 : 0.5) yt.push(v);
  const hi = new Set(top.slice(0, 12));
  const tr = r => `<tr><td class="l"><span class="who"><span class="duo">${r.names.map(n => av(n)).join("")}</span><span>${r.names.map(esc).join(" + ")}</span></span></td><td class="l">${esc(r.team)}</td><td class="l num">${yr(r.a)}${r.z > r.a ? "–" + String(r.z + 1).slice(2) : ""}</td>
    <td class="num">${Math.round(r.poss).toLocaleString()}</td><td class="num ${cls(r.net)}">${f(r.net)}</td><td class="num ${cls(r.syn)}"><b>${f(r.syn, 2)}</b><span class="pm">±${r.se.toFixed(2)}</span></td><td class="num ${cls(r.total)}">${f(r.total, 0)}</td></tr>`;
  const head = `<thead><tr><th class="l">${isTrio ? "Trio" : "Duo"}</th><th class="l">Team</th><th class="l">Seasons</th><th>Possessions together</th><th>Net together</th><th>Synergy</th><th>Extra points</th></tr></thead>`;
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Synergy · play-by-play, 1996-97 to 2024-25</div><h1>Better together</h1>
    <p class="lede">When two teammates share the floor, does their team do better than their individual ratings say it should? Synergy is the answer, in points per 100 possessions. Their ratings already come from the same games, so a pair that only ever plays together scores near zero; synergy shows up when their time together beats what their time apart implies.</p></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Duos or trios"><button data-smode="duo" aria-pressed="${!isTrio}">Duos</button><button data-smode="trio" aria-pressed="${isTrio}">Trios</button></div>
      <label for="sq">Find a player<input id="sq" type="search" placeholder="Name" value="${esc(S.q)}"></label>
      <label for="smin">Together at least<select id="smin">${[1500, 3000, 6000, 12000, 25000].map(v => `<option value="${v}" ${v === S.min ? "selected" : ""}>${v.toLocaleString()} poss.</option>`).join("")}</select></label>
      <label for="steam">Team<select id="steam"><option value="">Every team</option>${teams.map(t => `<option ${t === S.team ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label for="ssort">Rank by<select id="ssort"><option value="total" ${S.sort === "total" ? "selected" : ""}>Extra points (synergy × time together)</option><option value="rate" ${S.sort === "rate" ? "selected" : ""}>Synergy per 100 possessions</option></select></label>
      ${isTrio ? "" : `<div class="seg" role="group" aria-label="Hidden gems"><button data-sgems aria-pressed="${S.gems}">Hidden gems only</button></div>`}
    </div>
    ${!isTrio ? `<div class="panel"><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:460px" role="img" aria-label="Synergy against possessions together">
      ${yt.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`).join("")}
      ${xt.map(v => `<text x="${X(v)}" y="${Hh - 18}" text-anchor="middle">${v >= 1000 ? v / 1000 + "k" : v}</text>`).join("")}
      <text x="${(W + m.l) / 2}" y="${Hh - 2}" text-anchor="middle">Possessions together (log scale) · each dot is a duo</text>
      ${pts.slice().reverse().map(r => `<circle cx="${X(r.poss)}" cy="${Y(r.syn)}" r="${hi.has(r) ? 6 : 3.5}" fill="${hi.has(r) ? "var(--accent)" : "var(--muted)"}" fill-opacity="${hi.has(r) ? 1 : .35}" stroke="var(--surface)" stroke-width="${hi.has(r) ? 2 : 0}" data-tip="${esc(`${r.names.join(" + ")} (${r.team}, ${yr(r.a)}${r.z > r.a ? " to " + yr(r.z) : ""}): ${f(r.syn, 2)} per 100 over ${Math.round(r.poss).toLocaleString()} possessions`)}"/>`).join("")}
    </svg></div><p class="note">Orange: the top 12 in the current list. Up = better together than apart; right = more time together. ${rows.length.toLocaleString()} ${isTrio ? "trios" : "duos"} match.</p></div>` : ""}
    <div class="panel tablewrap"><h3>${ql ? `Best partners: ${esc(S.q)}` : isTrio ? "Best trios" : S.gems ? "Hidden gems: a star and a role player" : "Best duos"}</h3><table>${head}<tbody>${top.map(tr).join("")}</tbody></table></div>
    <div class="panel tablewrap"><h3>${ql ? `Worst partners: ${esc(S.q)}` : "Worst together"}</h3><table>${head}<tbody>${worst.map(tr).join("")}</tbody></table></div>
    <p class="note">Synergy = actual margin per 100 possessions while they share the floor (luck-adjusted) minus what all ten players' season ratings predict, shrunk toward zero by ${K.toLocaleString()} possessions (the amount that best predicts each pair's other seasons). It repeats only weakly from one half of a pair's seasons to the other (r = ${D.syn.reliability}), so a single pair's number has a wide margin: trust long partnerships and big samples. Extra points = synergy × possessions together ÷ 100. Hidden gems keeps a star (best-five-season rating +3 or better) paired with a role player (under +1.5), and pairs of two role players: the combinations nobody would guess.</p></div>`;
  const set = (k, v) => { state.syn = { ...S, [k]: v }; save(); synergy(); };
  document.querySelectorAll("[data-smode]").forEach(b => b.onclick = () => set("mode", b.dataset.smode));
  const sq = $("#sq"); sq.oninput = () => { clearTimeout(sq.t); sq.t = setTimeout(() => { set("q", sq.value); const n = $("#sq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  $("#smin").onchange = e => set("min", +e.target.value);
  $("#steam").onchange = e => set("team", e.target.value);
  $("#ssort").onchange = e => set("sort", e.target.value);
  const gb = document.querySelector("[data-sgems]"); if (gb) gb.onclick = () => set("gems", !S.gems);
}

/* ---------- lineup lab (drag and drop) ---------- */
function lineup() {
  if (!D.synMap) { D.synMap = new Map(D.syn.pairs.map(p => [synKey(p[0], p[1]), p])); }
  const pool = D.players.filter(p => p.poss >= 15000 && p.peak5 != null).sort((a, b) => b.peak5 - a.peak5);
  const byName = n => D.players.find(p => p.name === n)?.id;
  if (!state.lu) state.lu = ["Stephen Curry", "Klay Thompson", "Kevin Durant", "Andre Iguodala", "Draymond Green"].map(byName).map(x => x ?? null);
  const L = state.lu.map(id => id == null ? null : D.byId.get(String(id)));
  const q = (state.luq || "").toLowerCase();
  const chips = pool.filter(p => !q || p.name.toLowerCase().includes(q)).slice(0, 160);
  const filled = L.filter(Boolean);
  const indiv = filled.reduce((s, p) => s + p.peak5, 0);
  const pairsIn = [];
  for (let i = 0; i < 5; i++) for (let j = i + 1; j < 5; j++) if (L[i] && L[j]) {
    const s_ = D.synMap.get(synKey(L[i].id, L[j].id)); pairsIn.push({ i, j, s: s_ ? s_[8] : null, poss: s_ ? s_[7] : 0 });
  }
  // a pair's synergy already includes the effect of the five it played in, so the ten pairs of one five
  // share most of it: the five's synergy is the AVERAGE of its measured pairs (weighted by time together),
  // not the sum (summing would count the same five-man effect up to ten times)
  const meas = pairsIn.filter(p => p.s != null), mw = meas.reduce((s, p) => s + p.poss, 0);
  const synSum = mw ? meas.reduce((s, p) => s + p.s * p.poss, 0) / mw : 0;
  const total = indiv + synSum;
  const verdict = total >= 20 ? "an all-time lineup" : total >= 14 ? "a championship-level lineup" : total >= 8 ? "a contender's lineup" : total >= 3 ? "a good lineup" : "an average-or-worse lineup";
  const last = i => esc((L[i]?.name || "Empty").split(" ").slice(-1)[0]);
  const cell = (i, j) => { if (i === j) return `<div style="background:var(--bg);color:var(--muted)">–</div>`;
    const pr = pairsIn.find(p => (p.i === Math.min(i, j) && p.j === Math.max(i, j)));
    if (!pr) return `<div style="background:var(--bg)"></div>`;
    if (pr.s == null) return `<div style="color:var(--muted)" data-tip="Never shared enough floor time to measure">·</div>`;
    const a = Math.min(1, Math.abs(pr.s) / 2), col = pr.s >= 0 ? "21,127,59" : "180,35,24";
    return `<div class="num" style="background:rgba(${col},${(0.12 + 0.5 * a).toFixed(2)})" data-tip="${esc(`${L[Math.min(i, j)].name} + ${L[Math.max(i, j)].name}: ${f(pr.s, 2)} per 100 over ${Math.round(pr.poss).toLocaleString()} possessions together`)}">${f(pr.s, 1)}</div>`; };
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Lineup lab · play-by-play era</div><h1>Build a five</h1>
    <p class="lede">Drag players into the five spots (or tap a name to add it). Each player brings his best-five-season rating; pairs that actually shared the floor add their measured synergy (averaged across the pairs, weighted by time together). The total is how many points per 100 possessions this five would beat an average lineup by.</p></div>
    <div class="lab">
      <div class="panel stack" style="gap:12px;align-content:start"><div class="controls"><label for="luq">Find a player<input id="luq" type="search" placeholder="Name" value="${esc(state.luq || "")}"></label></div>
        <div class="pool" id="pool">${chips.map(p => `<span class="pchip" draggable="true" data-id="${p.id}" tabindex="0" role="button" aria-label="Add ${esc(p.name)}">${av(p.name)}${esc(p.name)}<b>${f(p.peak5)}</b></span>`).join("")}</div>
        <p class="note">${pool.length} players with 15,000+ possessions, best first. Number = best five seasons, points per 100 possessions.</p></div>
      <div class="stack" style="gap:16px">
        <div class="slots">${L.map((p, i) => `<div class="slot ${p ? "full" : ""}" data-slot="${i}">${p ? `${av(p.name)}<div class="nm">${esc(p.name)}</div><div class="rt ${cls(p.peak5)}">${f(p.peak5)}</div><button data-clear="${i}" aria-label="Remove ${esc(p.name)}">Remove</button>` : `<div class="note">Drop a player here</div>`}</div>`).join("")}</div>
        <div class="panel"><div class="hero"><div><div class="eyebrow">This five, per 100 possessions vs an average lineup</div>
          <p class="note" style="margin:6px 0 0">${filled.length < 5 ? `Add ${5 - filled.length} more to complete the five.` : `That's ${verdict}.`} Individual ratings ${f(indiv)} · synergy ${f(synSum, 2)} (average of ${meas.length} of ${pairsIn.length} pairs measured).</p></div>
          <div class="big ${cls(total)}" style="color:inherit">${f(total)}</div></div></div>
        <div class="panel stack" style="gap:8px"><h3>Pair synergy</h3>
          <div style="overflow-x:auto"><div class="grid5" style="grid-template-columns:minmax(76px,1fr) repeat(5,minmax(56px,1fr));min-width:400px"><div></div>${[0, 1, 2, 3, 4].map(j => `<div style="color:var(--muted);font-weight:600">${last(j)}</div>`).join("")}${[0, 1, 2, 3, 4].map(i => `<div style="color:var(--muted);font-weight:600;text-align:right">${last(i)}</div>` + [0, 1, 2, 3, 4].map(j => cell(i, j)).join("")).join("")}</div></div>
          <p class="note">Green: better together than their ratings say; red: worse. A dot means the two never shared enough floor time to measure. Players from different eras can't have synergy, so mixing eras adds only their individual ratings.</p></div>
        <div class="row"><button id="luex1">Load: 2016-17 Warriors</button><button id="luex2">Load: 2000-01 Lakers</button><button id="luex3">Load: 2013-14 Spurs</button><button id="luclr">Clear</button></div>
      </div></div></div>`;
  const put = (id, slot) => { const arr = state.lu.slice(); const at = arr.indexOf(id); if (at >= 0) arr[at] = null;
    const k = slot ?? arr.indexOf(null); if (k < 0) return; arr[k] = id; state.lu = arr; save(); lineup(); };
  document.querySelectorAll(".pchip").forEach(ch => { const id = +ch.dataset.id;
    ch.ondragstart = e => { e.dataTransfer.setData("text/plain", String(id)); e.dataTransfer.effectAllowed = "copy"; };

    sl.ondrop = e => { e.preventDefault(); const id = +e.dataTransfer.getData("text/plain"); if (id) put(id, i); }; });
