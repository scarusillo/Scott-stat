<title>The Scott Stat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a scorer's-table app. Sticky nav, one view at a time, tables and per-player pages. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --ink: #131b26; --muted: #5a6677; --line: #dce2ea;
  --accent: #c2410c; --off: #c2410c; --def: #1d5fd1; --good: #157f3b; --bad: #b42318; --c3: #7a3fb5; --band: rgba(194,65,12,.12);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c26; --ink: #e7ecf2; --muted: #95a1b2; --line: #263142;
  --accent: #fb7a35; --off: #fb7a35; --def: #6aa5ff; --good: #46c97a; --bad: #ff7b6e; --c3: #c08cf0; --band: rgba(251,122,53,.16); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --ink: #e7ecf2; --muted: #95a1b2; --line: #263142;
  --accent: #fb7a35; --off: #fb7a35; --def: #6aa5ff; --good: #46c97a; --bad: #ff7b6e; --c3: #c08cf0; --band: rgba(251,122,53,.16); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { font: 700 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; text-decoration: none; }
.brand span { color: var(--accent) }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 14px; }
nav a.on, nav a:hover { color: var(--ink); background: var(--bg); }
nav a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.05; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(34px, 6vw, 56px); text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: 28px; text-transform: uppercase; letter-spacing: .02em; }
h3 { font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
.lede { max-width: 66ch; color: var(--muted); font-size: 16px; margin: 10px 0 0; }
.stack { display: grid; gap: 24px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--good) } .neg { color: var(--bad) }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.controls label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
select, input[type=search], button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--ink); color: var(--surface); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
th.l, td.l { text-align: left }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--bg) }
td.rank { color: var(--muted); width: 1% }
.pm { color: var(--muted); font-size: 12px; margin-left: 3px }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { border-top: 3px solid var(--line); padding-top: 8px; }
.tile.o { border-color: var(--off) } .tile.d { border-color: var(--def) } .tile.a { border-color: var(--accent) }
.tile b { display: block; font: 600 32px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tile small { color: var(--muted); font-size: 12px; display: block; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; }
.big { font: 700 clamp(64px, 12vw, 104px)/.9 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
.big small { font-size: 28px; color: var(--muted); font-weight: 500; }
.split > *, .cols2 > *, .stack > * { min-width: 0 }
.split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .split, .hero { grid-template-columns: 1fr } }
.barline { display: grid; grid-template-columns: 150px minmax(0, 1fr) 84px; gap: 10px; align-items: center; font-size: 13px; }
.track { position: relative; height: 12px; background: var(--bg); border-radius: 3px; }
.track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; }
.prose { max-width: 70ch } .prose p { margin: 0 0 12px } .prose li { margin-bottom: 6px }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
svg text { fill: var(--muted); font: 11px var(--body); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); padding: 6px 8px; border-radius: 6px; font-size: 12px; z-index: 20; }
.flag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .25s ease-out } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>

<header><div class="wrap bar">
  <a class="brand" href="#leaders">The Scott <span>Stat</span></a>
  <nav id="nav">
    <a href="#leaders">Leaderboard</a><a href="#study">Study</a><a href="#legacy">Legacy</a><a href="#guide">Guide</a><a href="#compare">Compare</a><a href="#careers">Careers</a><a href="#progression">Progression</a>
    <a href="#coaches">Coaches</a><a href="#coachlab">Coach lab</a><a href="#scenarios">Scenarios</a><a href="#finder">GM finder</a><a href="#method">Method</a><a href="#launch">Launch plan</a>
  </nav>
</div></header>
<main class="wrap" id="app"><p class="note">Loading the Scott Stat…</p></main>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f = (x, d = 1, sign = true) => x == null ? "–" : (sign && x > 0 ? "+" : "") + x.toFixed(d);
const cls = x => x == null ? "" : x > 0.05 ? "pos" : x < -0.05 ? "neg" : "";
const yr = y => `${y}-${String((y + 1) % 100).padStart(2, "0")}`;
let D = null;
const state = { tier: "plus", sort: "scott", q: "", minPoss: 30000, csort: "net", fseason: null, ftype: "", a: null, b: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("scott-ui") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("scott-ui", JSON.stringify(state)); } catch (e) {} };

fetch("data.json").then(r => r.json()).then(d => { D = d; D.byId = new Map(D.players.map(p => [String(p.id), p]));
  D.cById = new Map(D.classic.map(p => [p.id, p])); route(); })
  .catch(() => { $("#app").innerHTML = `<p class="note">The data file didn't load. Reload the page to try again.</p>`; });
addEventListener("hashchange", route);

function route() {
  const h = location.hash.slice(1) || "leaders";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + h.split("-")[0] ||
    (h.startsWith("player") || h.startsWith("legend")) && a.getAttribute("href") === "#leaders"));
  const app = $("#app"); app.classList.remove("fade"); void app.offsetWidth; app.classList.add("fade");
  if (h.startsWith("player-")) return playerView(h.slice(7));
  if (h.startsWith("legend-")) return classicView(h.slice(7));
  ({ leaders, study, legacy, guide, compare, careers, coachlab, progression, coaches, scenarios, finder, method, launch }[h] || leaders)();
  scrollTo(0, 0);
}

/* ---------- leaderboard ---------- */
function leaders() {
  const plus = state.tier === "plus";
  const sorts = plus ? [["scott", "Scott Stat"], ["peak5", "Peak (best 5)"], ["war", "Career wins"], ["lift", "Lift"],
    ["def", "Defense"], ["clutch", "Clutch rise"], ["po", "Playoff rise"]] :
    [["pwar5", "Peak wins per season (best 5, era-neutral)"], ["pwar5_era", "Peak wins per season in his own era"], ["best5", "Impact per 100 possessions (best 5)"], ["create5", "Scoring & creation (best 5)"], ["score5", "Scoring load (best 5)"], ["stitles", "Scoring titles"], ["ind", "Individual (in peak window)"], ["team", "Team credit (in peak window)"], ["best5po", "Impact peak incl. playoffs"], ["prod5", "Best individual 5 seasons"], ["dom5", "Era dominance (best 5)"], ["no1", "Seasons ranked #1"],
     ["impact", "Career impact"], ["war", "Career wins"], ["lift", "Lift"], ["def", "Defense"]];
  if (!sorts.some(s => s[0] === state.sort)) state.sort = sorts[0][0];
  const rows = (plus ? D.players : D.classic).filter(p => (p.poss ?? 1e9) >= state.minPoss || !plus)
    .filter(p => !state.q || p.name.toLowerCase().includes(state.q.toLowerCase()))
    .filter(p => plus || p.seasons >= 6)
    .slice().sort((a, b) => (b[state.sort] ?? -99) - (a[state.sort] ?? -99)).slice(0, 150);
  $("#app").innerHTML = `
  <div class="stack">
    <div><div class="eyebrow">${plus ? "Play-by-play tier · 1996-97 to 2024-25" : "Classic tier · 1951-52 to 2025-26 · box score + team results"}</div>
      <h1>Who makes a team better</h1>
      <p class="lede">${plus ? "Points per 100 possessions a player adds over an average player, measured from every lineup on the floor, then adjusted for clutch and playoff performance. +5 is All-NBA. +7 is MVP level."
        : "The same scale estimated for every season since 1951-52, when minutes were first recorded, so Wilt, Russell, Jordan and Bird sit next to LeBron, Curry and Jokić. Less precise than Plus: a single season can be off by about ±1.6, and before 1973-74 no steals, blocks or turnovers were recorded."}</p></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Tier">
        <button id="t-plus" class="${plus ? "on" : ""}">Plus</button><button id="t-classic" class="${plus ? "" : "on"}">Classic (all eras)</button></div>
      <label for="sort">Rank by<select id="sort">${sorts.map(([k, l]) => `<option value="${k}" ${k === state.sort ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      ${plus ? `<label for="minp">Career length<select id="minp">${[[12000, "Any"], [30000, "4+ seasons"], [60000, "8+ seasons"]].map(([v, l]) =>
        `<option value="${v}" ${v == state.minPoss ? "selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
      <label for="q">Find a player<input id="q" type="search" placeholder="Name" value="${esc(state.q)}"></label>
    </div>
    <div class="panel tablewrap"><table><thead><tr><th></th><th class="l">Player</th><th class="l">Years</th>
      ${plus ? `<th>Scott Stat</th><th>Offense</th><th>Defense</th><th>Production</th><th>Lift</th><th>Clutch</th><th>Playoffs</th><th>Peak 5</th><th>Wins</th>`
        : `<th>Peak wins / season</th><th>Impact per 100</th><th>= Individual</th><th>+ Team credit</th><th>Scoring load</th><th>Era dominance</th><th>#1 seasons</th><th>Offense</th><th>Defense</th><th>Career wins</th>`}
    </tr></thead><tbody>${rows.map((p, i) => plus ? `<tr tabindex="0" data-go="#player-${p.id}">
      <td class="rank num">${i + 1}</td><td class="l"><b>${esc(p.name)}</b></td><td class="l num">${p.first}–${String(p.last + 1).slice(2)}${p.partial_from ? ` <span class="flag" title="Career began ${p.partial_from}; play-by-play covers only from 1996-97">late career</span>` : ""}</td>
      <td class="num"><b>${f(p.scott, 2)}</b><span class="pm">±${f(p.se, 1, false)}</span></td>
      <td class="num ${cls(p.off)}">${f(p.off)}</td><td class="num ${cls(p.def)}">${f(p.def)}</td>
      <td class="num">${f(p.prod)}</td><td class="num ${cls(p.lift)}">${f(p.lift)}</td>
      <td class="num ${cls(p.clutch)}">${f(p.clutch)}</td><td class="num ${cls(p.po)}">${f(p.po)}</td>
      <td class="num">${f(p.peak5)}</td><td class="num">${f(p.war, 0, false)}</td></tr>`
      : `<tr tabindex="0" data-go="#legend-${p.id}"><td class="rank num">${i + 1}</td><td class="l"><b>${esc(p.name)}</b>${p.lite > 0.5 ? ` <span class="flag" title="Most seasons before 1973-74: no steals, blocks or turnovers recorded">limited stats</span>` : ""}</td>
      <td class="l num">${p.first}–${String(p.last + 1).slice(2)}</td><td class="num"><b>${f(p.pwar5, 1, false)}</b></td><td class="num">${f(p.best5, 2)}</td><td class="num">${f(p.ind, 2)}</td><td class="num ${cls(p.team)}">${f(p.team, 2)}</td>
      <td class="num">${f(p.score5, 1)}${p.stitles ? `<span class="pm">${p.stitles} title${p.stitles > 1 ? "s" : ""}</span>` : ""}</td>
      <td class="num">${p.dom5 == null ? "–" : p.dom5.toFixed(2)}</td><td class="num">${p.no1 || ""}${p.top3 ? `<span class="pm">top 3: ${p.top3}</span>` : ""}</td>
      <td class="num ${cls(p.off)}">${f(p.off)}</td><td class="num ${cls(p.def)}">${f(p.def)}</td>
      <td class="num">${f(p.war, 0, false)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">${plus ? `Scott Stat = all-game impact + ${(D.meta.clutch_weight * 100).toFixed(0)}% of the clutch rise (clutch possessions are ${(D.meta.clutch_possession_share * 100).toFixed(0)}% of possessions but ${(D.meta.clutch_weight * 100).toFixed(0)}% of what decides games) + the playoff rise weighted by the player's share of playoff possessions. Production = what his own box score explains. Lift = the rest: teammates playing better and the team defending better while he's on the floor. ± is one standard error. "Late career" marks players whose careers began before 1996-97: only their later seasons are measured here, so use the Classic tier for their full careers.`
      : `<b>Peak wins per season</b> (the default ranking): wins added above a replacement player, averaged over his best five straight seasons, era-neutral: his per-possession level and his real minutes, played at a standard 100 possessions a game over 82 games. A 38-minute workhorse outranks an equally efficient 28-minute player, but a fast era's extra possessions (about 125 a game in the 1960s) don't count, because pace is a trait of the era, not the player. The in-era version is its own ranking. <b>Scoring load</b>: points per 100 team possessions he scored above an average player in his minutes, league- and pace-relative (best five straight seasons), with scoring titles. Three more ways to rank, three questions. <b>Impact peak</b>: how much better his team was with him on the floor (best five straight seasons, points per 100 possessions). It splits into two parts shown side by side: <b>Individual</b>, what his own stats were worth, era-adjusted, and <b>Team credit</b>, his share of how much his team did better or worse than its players' stats predict (from team results and game-by-game results with and without him). <b>Era dominance</b>: how far above his own league he was, in standard deviations, which is the fairest way to compare a 10-team league with a 30-team one. At the very top, gaps under about half a point of impact are within the margin of error.`}</p>
  </div>`;
  $("#t-plus").onclick = () => { state.tier = "plus"; save(); leaders(); };
  $("#t-classic").onclick = () => { state.tier = "classic"; save(); leaders(); };
  $("#sort").onchange = e => { state.sort = e.target.value; save(); leaders(); };
  if ($("#minp")) $("#minp").onchange = e => { state.minPoss = +e.target.value; save(); leaders(); };
  $("#q").oninput = e => { state.q = e.target.value; const pos = e.target.selectionStart; leaders(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); };
  bindRows();
}
function bindRows() { document.querySelectorAll("tr[data-go]").forEach(tr => { tr.onclick = () => location.hash = tr.dataset.go;
  tr.onkeydown = e => { if (e.key === "Enter") location.hash = tr.dataset.go; }; }); }

/* ---------- charts ---------- */
function seasonChart(seasons, opts = {}) {
  // seasons: [{season, net, se, team, extra}]
  if (!seasons.length) return "";
  const W = 720, Hh = 230, m = { l: 36, r: 12, t: 12, b: 26 };
  const xs = seasons.map(s => s.season), lo = Math.min(...xs), hi = Math.max(...xs);
  const vals = seasons.flatMap(s => [s.net - (s.se || 0), s.net + (s.se || 0), s.plus ?? s.net]);
  let ymin = Math.min(-2, Math.floor(Math.min(...vals))), ymax = Math.max(6, Math.ceil(Math.max(...vals)));
  const X = v => m.l + (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (W - m.l - m.r);
  const Y = v => m.t + (ymax - v) / (ymax - ymin) * (Hh - m.t - m.b);
  const ticks = []; for (let v = Math.ceil(ymin / 2) * 2; v <= ymax; v += 2) ticks.push(v);
  const band = seasons.filter(s => s.se != null);
  const area = band.length > 1 ? `<path d="M${band.map(s => `${X(s.season)},${Y(s.net + s.se)}`).join("L")}L${band.slice().reverse().map(s => `${X(s.season)},${Y(s.net - s.se)}`).join("L")}Z" fill="var(--band)" stroke="none"/>` : "";
  const line = `<path d="M${seasons.map(s => `${X(s.season)},${Y(s.net)}`).join("L")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const plusLine = opts.plus && seasons.filter(s => s.plus != null).length > 1 ? `<path d="M${seasons.filter(s => s.plus != null).map(s => `${X(s.season)},${Y(s.plus)}`).join("L")}" fill="none" stroke="var(--def)" stroke-width="2" stroke-dasharray="4 3"/>` : "";
  const xt = []; const step = Math.max(1, Math.ceil((hi - lo) / 8)); for (let v = lo; v <= hi; v += step) xt.push(v);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:420px" role="img" aria-label="Impact by season">
    ${ticks.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`).join("")}
    ${xt.map(v => `<text x="${X(v)}" y="${Hh - 6}" text-anchor="middle">${String(v).slice(2)}-${String((v + 1) % 100).padStart(2, "0")}</text>`).join("")}
    ${area}${plusLine}${line}
    ${seasons.map(s => `<circle cx="${X(s.season)}" cy="${Y(s.net)}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2" data-tip="${esc(`${yr(s.season)} ${s.team || ""}: ${f(s.net)}${s.se != null ? " ±" + s.se.toFixed(1) : ""}${s.plus != null ? " · Plus " + f(s.plus) : ""}${s.extra || ""}`)}"/>`).join("")}
  </svg></div>`;
}
function hbar(label, v, max, color, se) {
  const w = Math.min(50, Math.abs(v ?? 0) / max * 50);
  return `<div class="barline"><span>${label}</span><div class="track"><div class="zero"></div>
    <div class="fill" style="background:${color};${(v ?? 0) >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`}"></div></div>
    <span class="num ${cls(v)}" style="text-align:right">${f(v)}${se ? `<span class="pm">±${se.toFixed(1)}</span>` : ""}</span></div>`;
}
document.addEventListener("mousemove", e => { const t = e.target.closest?.("[data-tip]"); const tip = $("#tip");
  if (t) { tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - 240) + "px"; tip.style.top = (e.clientY + 12) + "px"; }
  else tip.hidden = true; });

/* ---------- player page (Plus) ---------- */
function explain(p) {
  const parts = [];
  const big = (p.off ?? 0) >= (p.def ?? 0) ? "offense" : "defense";
  parts.push(`${esc(p.name)} adds ${f(p.impact)} points per 100 possessions over an average player, mostly on ${big} (offense ${f(p.off)}, defense ${f(p.def)}).`);
  if (p.lift != null) parts.push(p.lift > 1 ? `About ${f(p.lift, 1, false)} of it doesn't show up in his own stats: his teammates play better and his team defends better while he's out there. That's lift.`
    : p.lift < -1 ? `His own stats overstate him by ${f(-p.lift, 1, false)}: his team does worse than his box score suggests when he plays. A production-first player.`
    : `His impact lines up with his own stats: what you see in the box score is about what the team gets.`);
  if (p.clutch != null && p.clutch_se) parts.push(Math.abs(p.clutch) > 1.5 * p.clutch_se ? `In the clutch he plays ${p.clutch > 0 ? "better" : "worse"} than his usual self (${f(p.clutch)} ±${p.clutch_se.toFixed(1)}), one of the few clear clutch signals in the data.`
    : `His clutch number (${f(p.clutch)} ±${p.clutch_se.toFixed(1)}) is within noise; for most players clutch isn't a separate skill.`);
  if (p.po != null && p.po_se) parts.push(Math.abs(p.po) > 1.5 * p.po_se ? `In the playoffs he plays ${p.po > 0 ? "above" : "below"} his regular-season level (${f(p.po)}).` : "");
  return parts.filter(Boolean).join(" ");
}

/* ---------- compare ---------- */
function compare() {
  const all = [...D.classic.map(p => ({ key: "c:" + p.id, label: p.name + " (Classic)", p, tier: "classic" })),
               ...D.players.map(p => ({ key: "p:" + p.id, label: p.name + " (Plus)", p, tier: "plus" }))].sort((a, b) => a.label.localeCompare(b.label));
  const find = k => all.find(x => x.key === k);
  if (!state.a) state.a = all.find(x => x.label === "Michael Jordan (Classic)")?.key;
  if (!state.b) state.b = all.find(x => x.label === "LeBron James (Classic)")?.key;
  const A = find(state.a), B = find(state.b);
  const metrics = [["Peak (best 5)", "best5"], ["Best season", "best"], ["Career impact", "impact"], ["Offense", "off"], ["Defense", "def"], ["Own production", "prod"], ["Lift", "lift"], ["Career wins", "war"]];
  const plusOnly = [["Scott Stat", "scott"], ["Clutch rise", "clutch"], ["Playoff rise", "po"]];
  const opt = sel => all.map(x => `<option value="${x.key}" ${x.key === sel ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  const row = ([l, k]) => { const a = A?.p[k], b = B?.p[k]; const w = a != null && b != null ? (a > b ? 0 : b > a ? 1 : -1) : -1;
    return `<tr><td class="l">${l}</td><td class="num" style="${w === 0 ? "font-weight:700" : ""}">${k === "war" ? f(a, 0, false) : f(a)}</td><td class="num" style="${w === 1 ? "font-weight:700" : ""}">${k === "war" ? f(b, 0, false) : f(b)}</td></tr>`; };

  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Compare</div><h1>Head to head</h1>
    <p class="lede">Compare players on the same tier. Plus is the precise number; Classic covers every era. Mixing tiers is allowed but flagged.</p></div>

      <tbody>${(A?.tier === "plus" && B?.tier === "plus" ? plusOnly : []).map(row).join("")}${metrics.map(row).join("")}</tbody></table></div>

  $("#ca").onchange = e => { state.a = e.target.value; save(); compare(); };
  $("#cb").onchange = e => { state.b = e.target.value; save(); compare(); };
}

/* ---------- study: findings ---------- */
function tierChart(list, se) {
  const W = 720, rowH = 30, m = { l: 150, r: 60, t: 22, b: 8 }, Hh = m.t + m.b + rowH * list.length, mx = 8;
  const X = v => m.l + Math.max(0, v) / mx * (W - m.l - m.r), lead = list[0].best5;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:480px" role="img" aria-label="All-time peaks with margins of error">
    ${[0, 2, 4, 6, 8].map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t - 4}" y2="${Hh - m.b}" stroke="var(--line)"/><text x="${X(t)}" y="12" text-anchor="middle">+${t}</text>`).join("")}
    <rect x="${X(lead - se)}" y="${m.t - 4}" width="${X(lead) - X(lead - se)}" height="${Hh - m.t - m.b + 4}" fill="var(--band)"/>
    ${list.map((p, i) => { const y = m.t + i * rowH, ind = Math.max(0, p.ind ?? 0), tc = p.team ?? 0;
      return `<text x="${m.l - 8}" y="${y + 17}" text-anchor="end" style="fill:var(--ink);font-size:13px;font-weight:${p.best5 >= lead - se ? 600 : 400}">${esc(p.name)}</text>
      <rect x="${X(0)}" y="${y + 6}" width="${X(ind) - X(0)}" height="14" fill="var(--muted)" data-tip="${esc(`${p.name}: individual ${f(p.ind, 2)}`)}"/>
      <rect x="${tc >= 0 ? X(ind) : X(ind + tc)}" y="${y + 6}" width="${Math.abs(X(ind + tc) - X(ind))}" height="14" fill="${tc >= 0 ? "var(--accent)" : "var(--bad)"}" data-tip="${esc(`${p.name}: team credit ${f(tc, 2)}`)}"/>
      <line x1="${X(p.best5 - se)}" x2="${X(p.best5 + se)}" y1="${y + 13}" y2="${y + 13}" stroke="var(--ink)" stroke-width="1.5"/>
      <line x1="${X(p.best5 - se)}" x2="${X(p.best5 - se)}" y1="${y + 8}" y2="${y + 18}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${X(p.best5 + se)}" x2="${X(p.best5 + se)}" y1="${y + 8}" y2="${y + 18}" stroke="var(--ink)" stroke-width="1.5"/>
      <text x="${W - m.r + 8}" y="${y + 17}" style="fill:var(--ink);font-size:12px">${f(p.best5, 2)}</text>`; }).join("")}
  </svg></div>`;
}
function study() {
  const S = D.study, C = S.carry, F = S.fit, se = 0.69;
  const tiers = D.classic.filter(p => p.seasons >= 6 && p.best5 != null).sort((a, b) => b.best5 - a.best5).slice(0, 14);
  const lead = tiers[0].best5, t1 = tiers.filter(p => p.best5 >= lead - se);
  const cs = D.coaches.filter(c => c.dev_n >= 40 && c.ind != null);
  const W = 720, Hh = 320, m = { l: 44, r: 14, t: 12, b: 34 };
  const xa = -0.6, xb = 0.6, ya = -0.6, yb = 0.6, X = v => m.l + (Math.max(xa, Math.min(xb, v)) - xa) / (xb - xa) * (W - m.l - m.r), Y = v => m.t + (yb - Math.max(ya, Math.min(yb, v))) / (yb - ya) * (Hh - m.t - m.b);
  const lab = new Set([...cs.slice().sort((a, b) => b.ind - a.ind).slice(0, 4), ...cs.slice().sort((a, b) => a.ind - b.ind).slice(0, 3),
    ...cs.slice().sort((a, b) => b.indlift - a.indlift).slice(0, 4), ...cs.slice().sort((a, b) => a.indlift - b.indlift).slice(0, 3)].map(c => c.id));
  const q = (state.sq || "").toLowerCase();
  const B = S.board.map(r => ({ id: r[0], n: r[1], t: r[2], age: r[3], pos: r[4], now: r[5], norm: r[6], gap: r[7], next: r[8] }));
  const brow = r => `<tr tabindex="0" data-go="#legend-${r.id}"><td class="l"><b>${esc(r.n)}</b></td><td class="l">${esc(r.t)}</td><td class="num">${r.age}</td><td class="num">${f(r.norm)}</td><td class="num">${f(r.now)}</td><td class="num ${cls(r.gap)}"><b>${f(r.gap)}</b></td><td class="num">${f(r.next)}</td></tr>`;
  const bhead = `<thead><tr><th class="l">Player</th><th class="l">Team</th><th>Age</th><th>His norm</th><th>This season</th><th>Gap</th><th>Expected next</th></tr></thead>`;
  const types = [...new Set(S.style_cells.map(r => r[0]))].sort(), traits = Object.keys(TRAIT);
  const cell = (t, k) => S.style_cells.find(r => r[0] === t && r[1] === k);
  const col = v => v > 0 ? `color-mix(in srgb, var(--good) ${Math.min(55, Math.abs(v) * 160)}%, transparent)` : `color-mix(in srgb, var(--bad) ${Math.min(55, Math.abs(v) * 160)}%, transparent)`;
  const dn = C.down_years, up = C.up_years;
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">The study · every NBA season since 1951-52</div><h1>What the box score hides</h1>
    <p class="lede">One measure of how much a player changes his team, applied to every player, coach and season on record, then tested against seasons it hadn't seen. What held up, what didn't, and what a front office can use.</p></div>

  <div class="panel"><h3>1 · The greatest peaks are a tier, not an order</h3>
    <p class="note">Best five straight seasons, points per 100 possessions over an average player. Grey = his own play. Orange = his share of how far his team beat its box scores. The black line is the margin of error (±${se}). Everyone whose bar reaches the shaded band is statistically tied with the leader: ${t1.map(p => esc(p.name)).join(", ")}.</p>
    ${tierChart(tiers, se)}
    <p class="note">Add championships and career length and the debate narrows to two: Michael Jordan and LeBron James hold the top two places under every weighting on the Legacy tab.</p></div>

  <div class="cols2">
    <div class="panel prose"><h3>2 · Teams pay for points, not wins</h3><div class="tiles"><div class="tile o"><small>Salary vs points per game</small><b>r = ${D.value.r_ppg}</b></div><div class="tile d"><small>Salary vs wins added</small><b>r = ${D.value.r_wins}</b></div></div>
      <p style="margin-top:10px">Across 2009-25, a player's pay follows his scoring far more closely than what he adds to winning. The gap is where the bargains are: players with high lift, whose teams play better and defend better with them than their own stats show. The GM finder lists them by season.</p></div>
    <div class="panel prose"><h3>3 · A down year is about 40% noise</h3><div class="tiles"><div class="tile a"><small>Carries over to next season</small><b>${Math.round(C.carryover * 100)}%</b></div><div class="tile"><small>After a down year of ${f(dn.this)}</small><b>${f(dn.next)}</b><small>next season, ${dn.n} cases</small></div></div>
      <p style="margin-top:10px">Measured against a player's own prior level and his age, ${Math.round(C.carryover * 100)}% of an up or down season is still there the next year and the rest fades (${C.pairs.toLocaleString()} season pairs since 1977). Up years fade the same way: ${f(up.this)} becomes ${f(up.next)}. A player priced on one bad or one great season is mispriced by about that much.</p></div>
    <div class="panel prose"><h3>4 · A change of scenery doesn't fix a down year</h3><div class="tiles"><div class="tile"><small>Stayed, next season</small><b>${f(dn.stayed_next)}</b><small>${dn.stayed_n} players</small></div><div class="tile"><small>Changed teams</small><b>${f(dn.moved_next)}</b><small>${dn.moved_n} players</small></div></div>
      <p style="margin-top:10px">Players coming off a down year recover about the same whether they move or stay. The recovery is the noise fading, not the new team.</p></div>
    <div class="panel prose"><h3>5 · Broad "style fit" didn't hold up</h3><div class="tiles"><div class="tile"><small>Predicting unseen seasons</small><b>r = ${F.oos_r_fit_vs_deviation.toFixed(2)}</b></div><div class="tile"><small>Style × type links that clear the bar</small><b>${F.sig_cells_net} of ${F.cells_net}</b><small>about 3 expected by chance</small></div></div>
      <p style="margin-top:10px">Matching a player type to a coach's pace, three-point rate, rotation depth and the rest does not predict who plays above his norm (fit on 1996-2011, tested on 2012-24). What does hold up is narrower: specific coaches with specific player types (Coach lab), and a few scheme effects on defense.</p></div>
  </div>

  <div class="panel"><h3>6 · Coaches: who raises players' own production, and who raises their lift</h3>
    <p class="note">Each player-season is compared with that player's own norm at his age (his other seasons). Right = his players' own stats run above their norm under him. Up = their impact beyond their stats runs above their norm. Coaches with 40+ player-seasons. Coaches differ about twice as much on production as on lift, and the measure is modest: the same list from odd and even seasons agrees at r ≈ ${S.coach_split.production.split_half_r.toFixed(1)}.</p>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:480px" role="img" aria-label="Coaches: players' production against players' lift">
      ${[-0.4, -0.2, 0, 0.2, 0.4].map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${f(t)}</text>
        <line y1="${m.t}" y2="${Hh - m.b}" x1="${X(t)}" x2="${X(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${X(t)}" y="${Hh - 16}" text-anchor="middle">${f(t)}</text>`).join("")}
      <text x="${(W + m.l) / 2}" y="${Hh - 2}" text-anchor="middle">Players' own production vs their norm (points per 100)</text>
      ${cs.map(c => `<circle cx="${X(c.ind)}" cy="${Y(c.indlift)}" r="${lab.has(c.id) ? 5 : 3.5}" fill="${lab.has(c.id) ? "var(--accent)" : "var(--muted)"}" fill-opacity="${lab.has(c.id) ? 1 : .45}" data-tip="${esc(`${c.name}: production ${f(c.ind, 2)}, lift ${f(c.indlift, 2)} (${c.dev_n} player-seasons)`)}"/>` +
        (lab.has(c.id) ? `<text x="${X(c.ind) + 7}" y="${Y(c.indlift) + 4}" style="fill:var(--ink)">${esc(c.name.split(" ").slice(-1)[0])}</text>` : "")).join("")}
    </svg></div>
    <div class="cols2" style="margin-top:10px"><div class="tablewrap"><div class="eyebrow">Best for players' own production</div><table><tbody>${cs.slice().sort((a, b) => b.ind_s - a.ind_s).slice(0, 7).map(c => `<tr><td class="l">${esc(c.name)}</td><td class="num pos">${f(c.ind, 2)}</td><td class="num"><span class="pm">${c.dev_n} seasons</span></td></tr>`).join("")}</tbody></table></div>
      <div class="tablewrap"><div class="eyebrow">Best for players' lift</div><table><tbody>${cs.slice().sort((a, b) => b.indlift_s - a.indlift_s).slice(0, 7).map(c => `<tr><td class="l">${esc(c.name)}</td><td class="num pos">${f(c.indlift, 2)}</td><td class="num"><span class="pm">${c.dev_n} seasons</span></td></tr>`).join("")}</tbody></table></div></div></div>

  <div class="panel tablewrap"><h3>7 · Style × player type, tested honestly</h3>
    <p class="note">How far players of each type run above or below their own norm for each standard deviation of a coach's style, with the style measured from the coach's other seasons. • = clears two standard errors (${F.sig_cells_net} of ${F.cells_net}; chance alone gives about 3). Leads worth a scout's look, not rules.</p>
    <table><thead><tr><th class="l">Player type</th>${traits.map(k => `<th>${esc(TRAIT[k])}</th>`).join("")}</tr></thead><tbody>
    ${types.map(t => `<tr><td class="l"><b>${esc(t)}</b></td>${traits.map(k => { const c = cell(t, k); return `<td class="num" style="background:${c ? col(c[2]) : "transparent"}">${c ? f(c[2], 2) + (Math.abs(c[3]) >= 2 ? " •" : "") : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>

  <div class="panel"><h3>8 · Situation board, ${yr(C.latest_season)}</h3>
    <p class="note">Is a player above or below his own established level? "His norm" is what his prior seasons say he should be at this age. "Expected next" keeps ${Math.round(C.carryover * 100)}% of the gap and moves him a year along the aging curve. The data can't see whether a player is content; it can see whether he is playing like himself.</p>
    <div class="controls" style="margin-bottom:12px"><label for="sq">Find a player or team<input id="sq" type="search" placeholder="Name or team code" value="${esc(state.sq || "")}"></label></div>
    ${q ? `<div class="tablewrap"><table>${bhead}<tbody>${B.filter(r => r.n.toLowerCase().includes(q) || r.t.toLowerCase() === q).sort((a, b) => a.gap - b.gap).slice(0, 30).map(brow).join("") || `<tr><td class="l" colspan="7">No match among players with a three-season history.</td></tr>`}</tbody></table></div>` :
    `<div class="cols2"><div class="tablewrap"><div class="eyebrow">Furthest below their norm (age 31 and under): bounce-back candidates</div><table>${bhead}<tbody>${B.filter(r => r.age <= 31).sort((a, b) => a.gap - b.gap).slice(0, 12).map(brow).join("")}</tbody></table></div>
      <div class="tablewrap"><div class="eyebrow">Furthest above their norm: breakout or sell-high</div><table>${bhead}<tbody>${B.slice().sort((a, b) => b.gap - a.gap).slice(0, 12).map(brow).join("")}</tbody></table></div></div>`}
    <p class="note">Young players above their norm are often simply improving; older players above it are the sell-high cases. Ratings here are the all-era kind (box score plus team results), each season on its own.</p></div>
  </div>`;
  $("#sq").oninput = e => { state.sq = e.target.value; const pos = e.target.selectionStart; study(); const el = $("#sq"); el.focus(); el.setSelectionRange(pos, pos); };
  bindRows();
}

/* ---------- legacy: peak + career + championships, reader-weighted ---------- */
function legacy() {
  const W = { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 0.5, ...(state.lw4 || {}) };
  const pool = D.classic.filter(p => p.seasons >= 8 && p.pwar5 != null);
  // each ingredient as a percentage of the all-time top-10 level, so equal weights are equal at the top
  // (z-scores let championships count ~3x: most players have none, so anyone with several looked extreme)
  const stat = k => { const top = pool.map(p => p[k] ?? 0).sort((a, b) => b - a).slice(0, 10), ref = top.reduce((a, b) => a + b, 0) / top.length;
    return p => 100 * Math.max(0, p[k] ?? 0) / ref; };
  const zp = stat("pwar5"), zc = stat("war"), zr = stat("tshare"), zs = stat("create5"), zw = stat("winwins");
  const tot = W.peak + W.career + W.rings + W.scoring + W.winning || 1;
  const rows = pool.map(p => ({ p, score: (W.peak * zp(p) + W.career * zc(p) + W.rings * zr(p) + W.scoring * zs(p) + W.winning * zw(p)) / tot }))
    .sort((a, b) => b.score - a.score).slice(0, 40);
  // how much does the choice of weights matter? rank under 81 weightings: peak, titles, scoring & creation and
  // winning each at half, equal or double their default (career value kept at the reader's setting)
  const Z = pool.map(p => [p.id, zp(p), zc(p), zr(p), zs(p), zw(p)]), range = new Map(pool.map(p => [p.id, [999, 0]]));
  for (const a of [0.5, 1, 2]) for (const c of [0.5, 1, 2]) for (const e of [0.5, 1, 2]) for (const g of [0.5, 1, 2])
    Z.map(z => [z[0], a * W.peak * z[1] + W.career * z[2] + c * W.rings * z[3] + e * W.scoring * z[4] + g * W.winning * z[5]]).sort((x, y) => y[1] - x[1])
      .forEach(([id], i) => { const r = range.get(id); r[0] = Math.min(r[0], i + 1); r[1] = Math.max(r[1], i + 1); });
  const presets = [["Default (on-court, no longevity)", { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 0.5 }], ["No scoring & creation", { peak: 1, career: 0, rings: 1, scoring: 0, winning: 0.5 }],
                   ["Titles count double", { peak: 1, career: 0, rings: 2, scoring: 0.5, winning: 0.5 }], ["Winning full weight", { peak: 1, career: 0, rings: 1, scoring: 0.5, winning: 1 }],
                   ["Add longevity", { peak: 1, career: 1, rings: 1, scoring: 0.5, winning: 0.5 }], ["No titles", { peak: 1, career: 0, rings: 0, scoring: 0.5, winning: 0.5 }]];
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">All-time · 1951-52 to 2025-26</div><h1>Greatest of all time, your weights</h1>
    <p class="lede">Who was best on the court, and who won the most? Every default ingredient measures a player at his best, per season, so a long career earns nothing by itself; career totals are an optional dial. Scoring &amp; creation and winning count half by default: both overlap with impact, which already includes what his scoring did for his team and part of his team's results.</p></div>
    <div class="cols2">
      <div class="panel prose"><h3>The ingredients</h3><ul>
        <li><b>Peak:</b> wins added per season over his best five straight seasons: impact per possession x the minutes he played, at a standard 100 possessions a game over 82 games (era-neutral: a fast era's extra possessions don't count).</li>
        <li><b>Career value (off by default):</b> total wins added above a replacement player, every season. This is longevity: add it if you think lasting should count.</li>
        <li><b>Championships:</b> every title split among that team's players by how much each raised the team's title odds in those playoffs (his playoff rating, not his regular season), then adjusted for league size (a title among 30 teams counts more than one among 8). The best player on a champion typically gets 60-75% of that title; a second option about 20-25%.</li>
        <li><b>Scoring &amp; creation:</b> how much offense he carried: points, plus 1.1 points per assist (a basket worth about 2.2, half credited to the passer), plus half a possession's worth per offensive rebound (a new possession, same split), per 100 team possessions above an average player in his minutes, best five straight seasons, relative to his league and era. Impact already counts what this did for winning; this ingredient values the load itself.</li>
        <li><b>Winning:</b> did his teams win more than their box scores said they should? Fitted jointly over every NBA team-season since 1951-52, so it is identified by players changing teams: a player whose teams outperform on every roster he joins gets the credit; one whose teams fall short everywhere gets the blame. Counted as wins per season beyond the box score, in his prime (his ten best seasons), with no credit for career length. This is where defense, spacing, screening and lifting (or dragging) teammates show up.</li></ul></div>
      <div class="panel stack" style="gap:14px"><h3>Weights</h3>
        ${[["peak", "Peak"], ["rings", "Championships"], ["scoring", "Scoring &amp; creation"], ["winning", "Winning"], ["career", "Longevity (career value)"]].map(([k, l]) => `<label for="w-${k}" class="row" style="justify-content:space-between"><span>${l}</span>
          <input id="w-${k}" type="range" min="0" max="3" step="0.5" value="${W[k]}" style="flex:1;max-width:220px"><span class="num" style="width:3ch">${W[k]}</span></label>`).join("")}
        <div class="row">${presets.map(([l, w], i) => `<button data-preset="${i}">${l}</button>`).join("")}</div>
        <p class="note">Each ingredient is scored as a percentage of the all-time top-10 level (100 = a typical top-10 mark), so equal weights count equally at the top.</p></div>
    </div>
    <div class="panel tablewrap"><table><thead><tr><th></th><th class="l">Player</th><th class="l">Career</th><th>Score</th><th>Rank range</th><th>Peak wins / season</th><th>Career wins</th><th>Titles</th><th>Title shares</th><th>Scoring &amp; creation</th><th>Winning wins / season</th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr tabindex="0" data-go="#legend-${r.p.id}"><td class="rank num">${i + 1}</td><td class="l"><b>${esc(r.p.name)}</b></td><td class="l num">${r.p.first}–${String(r.p.last + 1).slice(2)}</td>
        <td class="num"><b>${r.score.toFixed(0)}</b></td><td class="num">${(x => x[0] === x[1] ? x[0] : x[0] + "–" + x[1])(range.get(r.p.id))}</td><td class="num">${f(r.p.pwar5, 1, false)}</td><td class="num">${f(r.p.war, 0, false)}</td><td class="num">${r.p.titles || ""}</td><td class="num">${(r.p.tshare ?? 0).toFixed(2)}</td><td class="num">${f(r.p.create5, 1)}${r.p.stitles ? `<span class="pm">${r.p.stitles} scoring title${r.p.stitles > 1 ? "s" : ""}</span>` : ""}</td><td class="num">${f(r.p.winwins, 1)}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">Rank range is each player's best and worst rank across 81 weightings (peak, titles, scoring &amp; creation and winning each at half, equal or double their setting). A narrow range means the ranking doesn't depend on the weights. Players with fewer than eight qualifying seasons aren't ranked here yet. ABA seasons (1967-68 to 1975-76) count, moved down to NBA level using the players who switched leagues; ABA titles count at their league-size weight (10-11 teams). From 1996-97 on, each season's ratings use play-by-play too, which decides who ranks where inside a season but never stretches the scale.</p></div>`;
  for (const k of ["peak", "career", "rings", "scoring", "winning"]) $("#w-" + k).oninput = e => { state.lw4 = { ...W, [k]: +e.target.value }; save(); legacy(); $("#w-" + k).focus(); };
  document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { state.lw4 = presets[+b.dataset.preset][1]; save(); legacy(); });
  bindRows();
}

/* ---------- shared: multi-line chart ---------- */
function lineChart(series, o = {}) {
  const W = 720, Hh = o.h || 260, m = { l: 38, r: 12, t: 12, b: 30 };
  const all = series.flatMap(s => s.pts); if (!all.length) return "";
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.floor(Math.min(o.ymin ?? 0, ...ys)), y1 = Math.ceil(Math.max(o.ymax ?? 0, ...ys));
  const X = v => m.l + (v - x0) / (x1 - x0 || 1) * (W - m.l - m.r), Y = v => m.t + (y1 - v) / (y1 - y0 || 1) * (Hh - m.t - m.b);
  const yt = []; const st = (y1 - y0) > 8 ? 2 : 1; for (let v = y0; v <= y1; v += st) yt.push(v);
  const xt = []; const xs2 = Math.max(1, Math.ceil((x1 - x0) / 10)); for (let v = Math.ceil(x0); v <= x1; v += xs2) xt.push(v);
  return `<div class="chips" style="margin:6px 0">${series.map(s => `<span class="chip" style="border-color:${s.color};color:var(--ink)"><span style="display:inline-block;width:14px;border-top:2px ${s.dash ? "dashed" : "solid"} ${s.color};vertical-align:middle;margin-right:5px"></span>${esc(s.name)}</span>`).join("")}</div>
  <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Hh}" width="100%" style="min-width:420px" role="img" aria-label="${esc(o.label || "chart")}">
    ${o.band ? `<rect x="${X(Math.max(x0, o.band[0]))}" y="${m.t}" width="${Math.max(0, X(Math.min(x1, o.band[1])) - X(Math.max(x0, o.band[0])))}" height="${Hh - m.t - m.b}" fill="var(--band)"/>` : ""}
    ${yt.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="${t === 0 ? 1.5 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t > 0 ? "+" + t : t}</text>`).join("")}
    ${xt.map(v => `<text x="${X(v)}" y="${Hh - 12}" text-anchor="middle">${v}</text>`).join("")}
    <text x="${(W + m.l) / 2}" y="${Hh - 1}" text-anchor="middle">${esc(o.xlabel || "")}</text>
    ${series.map(s => `<path d="M${s.pts.map(p => `${X(p[0])},${Y(p[1])}`).join("L")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""}/>` +
      (s.dots === false ? "" : s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2" data-tip="${esc(`${s.name}, ${o.xname || "age"} ${p[0]}: ${f(p[1])}${p[2] ? " · " + p[2] : ""}`)}"/>`).join(""))).join("")}
  </svg></div>`;
}
const PAL = ["var(--accent)", "var(--def)", "var(--c3)", "var(--good)"];

/* ---------- careers: arcs by age, aging curves, individual vs team credit ---------- */
function careers() {
  const byName = new Map(D.classic.map(p => [p.name, p]));
  const sel = (state.cpid || ["jordami01", "jamesle01", "jokicni01"]).map(i => D.cById.get(i)).filter(Boolean);
  const gset = state.cg || "pos";
  const sets = { pos: ["All players", "Guards", "Wings", "Bigs"], era: ["1951-79", "1980-99", "2000-25"],
                 type: ["Lead creator", "Spot-up shooter", "Rim runner", "Defensive wing"] };
  const AM = D.aging.meta, all = AM["All players"];
  const arc = sel.map((p, i) => ({ name: p.name, color: PAL[i], pts: p.s.filter(r => r[8] != null).map(r => [r[8], r[2], `${yr(r[0])} ${r[1]}`]) }));
  const split = p => { const mx = 8, a = Math.max(0, p.ind ?? 0) / mx * 100, b = Math.abs(p.team ?? 0) / mx * 100;
    return `<div class="track" style="height:14px"><div class="fill" style="left:0;width:${a}%;background:var(--muted)"></div><div class="fill" style="left:${(p.team ?? 0) >= 0 ? a : a - b}%;width:${b}%;background:${(p.team ?? 0) >= 0 ? "var(--accent)" : "var(--bad)"}"></div></div>`; };
  const peakAge = p => { const r = p.s.filter(x => x[8] != null).sort((a, b) => b[2] - a[2])[0]; return r ? r[8] : "–"; };
  const typeRows = Object.entries(AM).filter(([k]) => !["All players", "Guards", "Wings", "Bigs", "1951-79", "1980-99", "2000-25"].includes(k));
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Careers · 1951-52 to 2025-26</div><h1>How impact changes over a career</h1>
    <p class="lede">The typical player peaks at ${all.peak_age} and holds his prime from about ${all.prime_from} to ${all.prime_to}. Compare any players' arcs by age, and see how much of each peak was his own play and how much came from team results.</p></div>
    <div class="controls">${[0, 1, 2].map(i => `<label for="cp${i}">Player ${i + 1}<input id="cp${i}" list="cplist" type="search" value="${esc(sel[i]?.name || "")}" placeholder="Name" style="min-width:190px"></label>`).join("")}
      <datalist id="cplist">${D.classic.filter(p => p.seasons >= 5).map(p => `<option value="${esc(p.name)}">`).join("")}</datalist></div>
    <div class="panel"><h3>Impact by age</h3><p class="note">Points per 100 possessions over an average player (Classic tier, so every era is on one scale). The shaded band is the typical prime, ages ${all.prime_from}–${all.prime_to}.</p>
      ${lineChart(arc, { band: [all.prime_from, all.prime_to], xlabel: "Age", ymin: -2, ymax: 7, label: "Impact by age" })}</div>
    <div class="panel tablewrap"><h3>Peak, split into individual and team credit</h3>
      <table><thead><tr><th class="l">Player</th><th class="l">Best 5 seasons</th><th>Best age</th><th>Impact peak</th><th>= Individual</th><th>+ Team credit</th><th class="l" style="min-width:180px">Split</th><th>Titles</th></tr></thead><tbody>
      ${sel.map(p => `<tr tabindex="0" data-go="#legend-${p.id}"><td class="l"><b>${esc(p.name)}</b></td><td class="l num">${p.best5_years || "–"}</td><td class="num">${peakAge(p)}</td><td class="num"><b>${f(p.best5, 2)}</b></td><td class="num">${f(p.ind, 2)}</td><td class="num ${cls(p.team)}">${f(p.team, 2)}</td><td class="l">${split(p)}</td><td class="num">${p.titles || ""}</td></tr>`).join("")}</tbody></table>
      <p class="note">Grey = individual: what his own stats were worth, era-adjusted. Orange = team credit: his share of how much his team beat what its players' stats predict, from team results and from games with and without him. Reported separately because they answer different questions and the team part is the less certain one.</p></div>
    <div class="split">
      <div class="panel"><h3>Aging curves</h3>
        <div class="seg" role="group" aria-label="Group">${[["pos", "By position"], ["era", "By era"], ["type", "By player type"]].map(([k, l]) => `<button data-cg="${k}" class="${gset === k ? "on" : ""}">${l}</button>`).join("")}</div>
        ${lineChart(sets[gset].filter(g => D.aging.curves[g]).map((g, i) => ({ name: g, color: PAL[i], pts: D.aging.curves[g], dots: false })), { xlabel: "Age", ymax: 0, ymin: -3, label: "Aging curves" })}
        <p class="note">Average change in impact from one age to the next, chained together and set to 0 at the peak. Players who decline lose their minutes and leave the sample, so the real late-career drop is a little steeper than shown.</p></div>
      <div class="panel tablewrap"><h3>Peak and prime by player type</h3><table><thead><tr><th class="l">Type</th><th>Peak age</th><th>Prime</th><th>At 22</th></tr></thead><tbody>
        ${typeRows.map(([k, v]) => `<tr><td class="l">${esc(k)}</td><td class="num">${v.peak_age}</td><td class="num">${v.prime_from}–${v.prime_to}</td><td class="num">${f(v.at_22)}</td></tr>`).join("")}</tbody></table>
        <p class="note">Prime = ages within 0.15 points of the peak. "At 22" is how far below his peak the typical player of that type is at 22: lead creators and playmaking guards have the most growth ahead of them.</p></div>
    </div></div>`;
  [0, 1, 2].forEach(i => $("#cp" + i).onchange = e => { const names = sel.map(p => p.name); names[i] = e.target.value;
    state.cpid = names.map(n => byName.get(n)?.id).filter(Boolean); save(); careers(); });

  bindRows();
