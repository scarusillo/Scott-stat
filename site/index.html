  $("#luex1").onclick = () => load(["Stephen Curry", "Klay Thompson", "Kevin Durant", "Andre Iguodala", "Draymond Green"]);
  $("#luex2").onclick = () => load(["Derek Fisher", "Kobe Bryant", "Rick Fox", "Horace Grant", "Shaquille O'Neal"]);
  $("#luex3").onclick = () => load(["Tony Parker", "Danny Green", "Kawhi Leonard", "Tim Duncan", "Manu Ginobili"]);
  $("#luclr").onclick = () => { state.lu = [null, null, null, null, null]; save(); lineup(); };
  const lq = $("#luq"); lq.oninput = () => { clearTimeout(lq.t); lq.t = setTimeout(() => { state.luq = lq.value; save(); lineup(); const n = $("#luq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
}

/* ---------- guide: how to read the Scott Stat ---------- */
function guide() {
  const top = D.classic.filter(p => p.best5 != null).sort((a, b) => b.best5 - a.best5).slice(0, 5);
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Guide</div><h1>How to read the Scott Stat</h1>
    <p class="lede">One question, answered for every player who has played real minutes since 1951-52: how much better is a team with him on the floor than with an average player in his place, and why?</p></div>
  <div class="cols2">
    <div class="panel prose"><h3>The unit: points per 100 possessions</h3>
      <p>A possession is one trip down the floor. A team gets about 100 a game, so "per 100 possessions" is roughly "per full game." A rating of +6 means: swap an average NBA player out and this player in, same teammates, same opponents, and the team comes out 6 points better per 100 possessions. That counts both ends: points his team scores and points the other team doesn't.</p>
      <p>Because a star plays about three-quarters of the game, each point of rating is worth about <b>2 wins</b> over a season. A +6 player turns a 41-win team into a 53-win team.</p></div>
    <div class="panel"><h3>The scale</h3><div class="tablewrap"><table><tbody>
      <tr><td class="l">−2</td><td class="l">Replacement level: freely available, end of the bench</td></tr>
      <tr><td class="l">0</td><td class="l">Average NBA player</td></tr>
      <tr><td class="l">+2 to +3</td><td class="l">Good starter</td></tr>
      <tr><td class="l">+5</td><td class="l">All-NBA</td></tr>
      <tr><td class="l">+7 or more</td><td class="l">MVP-level season</td></tr></tbody></table></div></div>
  </div>
  <div class="panel prose"><h3>What "peak 6.2" means</h3>
    <p>Peak is the player's average rating over his best five consecutive seasons. It's the fairest way to compare greatness across careers of different length: one great year can be luck, five in a row can't. The all-time peaks right now: ${top.map(p => `${esc(p.name)} ${f(p.best5)} (${p.best5_years})`).join(", ")}. A peak of +6.2 means that for five straight years, his team was about 6 points per 100 possessions better because he was the one on the floor: roughly 12 extra wins a season, every season, for five years.</p>
    <p>Career impact is the same rating averaged over every season (it rewards consistency and punishes a long decline). Career wins added is the total: rate × minutes × seasons, above a replacement-level player. A long great career wins on total; a shorter, higher peak can win on peak. At the very top the gaps are smaller than the error: a five-season peak is good to about ±0.7, so players within about half a point of each other are a statistical tie and are best read as one tier.</p></div>
  <div class="cols2">
    <div class="panel prose"><h3>Offense and defense</h3><p>The two halves of the number. Defense comes from the scoreboard: points the other team didn't score while he was out there, compared with what the ten players' normal levels predict. Steals and blocks are evidence, not the calculation.</p></div>
    <div class="panel prose"><h3>Own production and lift</h3><p>Production is what his own box score explains: scoring efficiency, volume, assists, turnovers, boards, steals, blocks. Lift is everything else: his teammates playing better and his team defending better while he's on the floor. High-lift players (Jason Kidd, Draymond Green, Marcus Smart) are worth more than their stats. Negative-lift players produce numbers the team doesn't turn into wins.</p></div>
    <div class="panel prose"><h3>Clutch and playoffs</h3><p>Clutch is the last five minutes of the fourth quarter or overtime within five points. Clutch rise is how much better his lineups did in those minutes than everyone's normal levels predict. It counts ${(D.meta.clutch_weight * 100).toFixed(0)}% in the Scott Stat because clutch possessions carry ${(D.meta.clutch_weight * 100).toFixed(0)}% of what decides games. For most players it's noise; a few (LeBron, Lillard, Dirk) rise in both halves of their careers. Playoff rise works the same way over every playoff possession.</p></div>
    <div class="panel prose"><h3>Plus and Classic</h3><p><b>Plus</b> (1996-97 on) is measured from every lineup on the floor, possession by possession. It's the precise number: a career rating is good to about ±0.3. <b>Classic</b> (1951-52 on) estimates the same thing from season box scores and team results, trained on the seasons where both exist. It's the only way to put Wilt, Russell, Magic and prime Jordan on the same scale, but a single season can be off by ±1.6, and it reads a little low at the very top. Rank within one tier, never across them.</p></div>
  </div>
  <div class="cols2">
    <div class="panel prose"><h3>Three eras of data</h3><ul><li><b>1977-78 on:</b> full box score.</li><li><b>1973-74 to 1976-77:</b> no turnovers.</li><li><b>1951-52 to 1972-73:</b> no steals, blocks or turnovers. Accuracy drops (r 0.66 to 0.60 against play-by-play).</li><li><b>Every era since 1951-52:</b> every game's result and who played in it. Game by game, a team's margin with and without each player moves credit between teammates. Tested on 2013-25 against play-by-play, it improves Classic (r 0.658 to 0.674).</li><li><b>Before 1951-52:</b> no individual minutes, so no per-possession rating. George Mikan's early years can't be rated.</li></ul></div>
    <div class="panel prose"><h3>Coaches: what's reliable</h3><ul><li><b>Reliable:</b> a coach's overall effect on players (mostly on defense), which player types he gets most from, Rotation IQ and Closing IQ. Each holds up when estimated on separate halves of the data.</li><li><b>Suggestive:</b> coaching style × player type. A few cells are real (rim protectors under defense-first coaches); most are noise.</li><li><b>Not detectable yet:</b> players jumping the year they arrive at a new coach, and young-player development by coach.</li></ul></div>
  </div></div>`;
}

/* ---------- progression ---------- */
function progression() {
  const tier = state.ptier || "plus", P = D.progression[tier];
  const nameCell = (id, n) => tier === "plus" && D.byId.has(String(id)) ? `<a href="#player-${id}">${esc(n)}</a>` : (D.cById.has(id) ? `<a href="#legend-${id}">${esc(n)}</a>` : esc(n));
  const chg = (rows, title) => `<div class="panel tablewrap"><h3>${title}</h3><table><thead><tr><th class="l">Player</th><th class="l">Season</th><th class="l">Team</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>
    ${rows.slice(0, 20).map(r => `<tr><td class="l">${nameCell(r[0], r[1])}</td><td class="l num">${yr(r[2])} → ${String(r[2] + 1).slice(2)}-${String((r[2] + 2) % 100).padStart(2, "0")}</td><td class="l">${esc(r[3])}${r[4] !== r[3] ? " → " + esc(r[4]) : ""}</td>
      <td class="num">${f(r[5])}</td><td class="num">${f(r[6])}</td><td class="num ${cls(r[7])}"><b>${f(r[7])}</b><span class="pm">±${f(r[8], 1, false)}</span></td></tr>`).join("")}</tbody></table></div>`;
  const arc = (rows, title, k) => `<div class="panel tablewrap"><h3>${title}</h3><table><thead><tr><th class="l">Player</th><th class="l">Career</th><th>Start</th><th>Peak (3 yr)</th><th class="l">When</th><th>End</th><th>${k === 8 ? "Rise" : "Fall"}</th></tr></thead><tbody>
    ${rows.slice(0, 20).map(r => `<tr><td class="l">${nameCell(r[0], r[1])}</td><td class="l num">${r[2]}–${String(r[3] + 1).slice(2)}</td><td class="num">${f(r[4])}</td><td class="num">${f(r[5])}</td><td class="l num">${r[6]}</td><td class="num">${f(r[7])}</td><td class="num ${cls(r[k])}"><b>${f(r[k])}</b></td></tr>`).join("")}</tbody></table></div>`;
  const am = D.progression.arrivals_meta;
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">Progression</div><h1>Who rose, who fell</h1>
    <p class="lede">Every player's season-by-season arc is on his page. These lists pull out the biggest moves. A one-year change is listed only when it's more than twice its own margin of error, so noise doesn't make the list.</p></div>
    <div class="controls"><div class="seg" role="group" aria-label="Tier"><button id="pt-plus" class="${tier === "plus" ? "on" : ""}">Plus (1996 on)</button><button id="pt-classic" class="${tier === "classic" ? "on" : ""}">Classic (all eras)</button></div></div>
    <div class="cols2">${chg(P.rises, "Biggest one-year rises")}${chg(P.falls, "Biggest one-year falls")}</div>
    <div class="cols2">${arc(P.arc_rise, "Biggest climb to a peak", 8)}${arc(P.arc_fall, "Biggest fall from a peak", 9)}</div>
    <div class="panel tablewrap"><h3>Players arriving at a new coach</h3>
      <p class="note">Every time a player started playing for a new coach (${am.arrivals.toLocaleString()} moves since 1996-97): his change in impact against what's expected for his experience and starting level, averaged per coach. <b>This does not hold up yet:</b> the same list built from odd and even seasons agrees at r = ${am.split_half_r.toFixed(2)}, which is noise. Read it as a record of what happened, not as a coach skill. The coach effects on the Coaches and Scenarios pages are the reliable measure.</p>
      <table><thead><tr><th class="l">Coach</th><th>Arrivals</th><th>Average change</th><th>Shrunk estimate</th><th class="l">Biggest arrival jump</th></tr></thead><tbody>
      ${D.progression.arrivals.slice(0, 25).map(r => `<tr><td class="l">${esc(r[0])}</td><td class="num">${r[1]}</td><td class="num ${cls(r[2])}">${f(r[2])}</td><td class="num">${f(r[3], 2)}<span class="pm">±${f(r[4], 2, false)}</span></td><td class="l">${esc(r[5])}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#pt-plus").onclick = () => { state.ptier = "plus"; save(); progression(); };
  $("#pt-classic").onclick = () => { state.ptier = "classic"; save(); progression(); };
}

/* ---------- scenarios: coach style x player type ---------- */
function scenarios() {
  const M = D.scenarios.matrix, B = D.scenarios.best;
  const groups = [...new Set(M.map(r => r[0]))], types = [...new Set(M.map(r => r[1]))].sort();
  const cell = (g, t) => M.find(r => r[0] === g && r[1] === t);
  const color = v => v == null ? "transparent" : v > 0 ? `color-mix(in srgb, var(--good) ${Math.min(60, Math.abs(v) * 90)}%, transparent)` : `color-mix(in srgb, var(--bad) ${Math.min(60, Math.abs(v) * 90)}%, transparent)`;
  const ptype = state.stype || "Rim runner";
  const best = B.filter(r => r[0] === ptype);
  const nowPlayers = D.recent.filter(r => r[12] === ptype && r[2] === Math.max(...D.recent.map(x => x[2]))).sort((a, b) => b[4] - a[4]).slice(0, 8);
  $("#app").innerHTML = `<div class="stack"><div><div class="eyebrow">For front offices</div><h1>Which coach for which player</h1>
    <p class="lede">Pair a coach with a player type and see how players of that type have played under him, compared with their own career levels. Start with a type (a pass-first point guard is a Playmaking guard; a Rudy Gobert type is a Rim runner).</p></div>
    <div class="controls"><label for="stype">Player type<select id="stype">${types.map(t => `<option ${t === ptype ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label></div>
    <div class="split">
      <div class="panel tablewrap"><h3>Coaches who get the most from ${esc(ptype)}s</h3><table><thead><tr><th class="l">Coach</th><th>Uplift</th><th>Players</th><th class="l">Most-used player</th></tr></thead><tbody>
        ${best.map(r => `<tr><td class="l"><b>${esc(r[1])}</b></td><td class="num ${cls(r[2])}"><b>${f(r[2])}</b><span class="pm">±${f(r[3], 1, false)}</span></td><td class="num">${r[5]}</td><td class="l">${esc(r[6])} <span class="pm">${Math.round(r[7] * 100)}%</span></td></tr>`).join("")}</tbody></table>
        <p class="note">Uplift = points per 100 possessions a ${esc(ptype.toLowerCase())} plays above his own career level under that coach. Only coaches whose result comes from several players (no single star above 50% of the minutes). Halves of the data agree at r ≈ 0.4: a real but noisy signal.</p></div>
      <div class="panel tablewrap"><h3>${esc(ptype)}s now (${yr(Math.max(...D.recent.map(x => x[2])))})</h3><table><tbody>
        ${nowPlayers.map(r => `<tr ${D.byId.has(String(r[0])) ? `tabindex="0" data-go="#player-${r[0]}"` : ""}><td class="l">${esc(r[1])}</td><td class="l">${esc(r[3])}</td><td class="num ${cls(r[4])}">${f(r[4])}</td></tr>`).join("")}</tbody></table></div>
    </div>
    <div class="panel tablewrap"><h3>Coaching style × player type</h3>
      <p class="note">Each cell: how much more (green) or less (red) that player type gets under coaches of that style than under coaches in general, points per 100. A dot marks the ${M.filter(r => Math.abs(r[4]) >= 2).length} cells that clear two standard errors. With ${M.length} cells, about ${Math.round(M.length * 0.05)} would clear by chance alone, so treat single cells as leads, not conclusions.</p>
      <table><thead><tr><th class="l">Coach style</th>${types.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>
      ${groups.map(g => `<tr><td class="l"><b>${esc(g)}</b></td>${types.map(t => { const c = cell(g, t); return `<td class="num" style="background:${color(c?.[2])}" ${c ? `data-tip="${esc(`${g} × ${t}: ${f(c[2], 2)} ±${c[3].toFixed(2)} (${c[5]} coaches: ${c[6]})`)}"` : ""}>${c ? f(c[2], 2) + (Math.abs(c[4]) >= 2 ? " •" : "") : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  $("#stype").onchange = e => { state.stype = e.target.value; save(); scenarios(); };
  bindRows();
}

/* ---------- method ---------- */
function method() {
  const v = D.validation || {}; const cl = v.classic || {};
  const pct = x => x == null ? "–" : x.toFixed(2);
  $("#app").innerHTML = `<div class="stack prose"><div><div class="eyebrow">Method</div><h1>How the Scott Stat works</h1></div>
  <div class="panel prose"><h3>1 · Impact, from every lineup</h3><p>Every NBA game since 1996-97 is rebuilt possession by possession: who was on the floor, and what happened. About a million stretches of play. A regression solves for every player at once, so a player gets credit only for what his team does better when he's on the floor, after accounting for every teammate and opponent. Three-pointers and free throws are replaced by each shooter's expected percentage, so a cold-shooting night by opponents doesn't count as defense.</p>
    <p>Checked out of sample: ratings fit on three seasons predict the next season's games better than raw plus-minus, and predict team win totals better than last season's record.</p></div>
  <div class="panel prose"><h3>2 · Production and lift</h3><p>Each player's box score is converted to an expected impact using skill prices learned from the play-by-play era (a turnover costs 0.75 points per 100 possessions, a steal is worth about 1). Production is that part. Lift is everything else: teammates playing better and the team defending better while he's out there. The box score explains about ${v.box_fit ? Math.round(v.box_fit.O_cv_r2 * 100) : 61}% of offensive impact and only ${v.box_fit ? Math.round(v.box_fit.D_cv_r2 * 100) : 25}% of defensive impact.</p></div>
  <div class="panel prose"><h3>3 · Clutch and playoffs</h3><p>Clutch is the NBA's definition: the last five minutes of the fourth quarter or overtime, within five points. A player's clutch rise is how much better his lineups did in those minutes than everyone's normal ratings predict. Clutch possessions are ${(D.meta.clutch_possession_share * 100).toFixed(0)}% of all possessions but carry ${(D.meta.clutch_weight * 100).toFixed(0)}% of the swings in win probability, so that's its weight in the Scott Stat. Playoff rise works the same way over every playoff possession.</p>
    <p>For most players, clutch is not a repeatable skill: estimated on odd and even seasons separately, the two halves barely agree. The ranking keeps it at its earned weight and shows the error range.</p></div>
  <div class="panel prose"><h3>4 · Coaches</h3><p>Players are held at their own career level and aging curve, so a coach gets credit only when players play above their norm under him. Players moving between coaches separate the coach from the player. The same machinery estimates how each player did under each coach, with or without his own career arc removed.</p></div>
  <div class="panel prose"><h3>5 · Classic, for every era</h3><p>Before 1996-97 there's no play-by-play. Classic estimates the same impact from season box scores plus team results, trained on the seasons where both exist. Two rules keep it honest across eras. It never extrapolates: every stat is capped at the range seen in the training seasons (John Stockton's late-1980s assist rate is higher than any season since 1996). And skill values are era-matched: each season is priced mostly from the play-by-play seasons nearest to it, because values drift (an assist was worth 0.33 points per 100 possessions in 1997-2004 and 0.42 in 2019-25). The weighting was chosen by predicting 1996-2002 from later seasons only, the same situation Classic faces for the 1980s. Finally, every game since 1951-52 adds a with-or-without signal: each team's margin game by game, with each player's minutes, starting from his box-score rating and moving only as far as the game evidence supports. It improved accuracy on held-out seasons (r 0.658 to 0.674) and was adopted for that reason. Tested on 2014-2025, it tracks the play-by-play number at r = ${pct(cl.test_classic?.r_net)} (Basketball-Reference's BPM: ${pct(cl.test_bref_bpm?.r_net)}). It squeezes the very top, so Plus and Classic are never mixed in one ranking.</p></div>
  <div class="panel prose"><h3>Audit log</h3><p>The model was re-checked from the position that something in it was wrong. What that found and fixed:</p><ul>
    <li><b>Pace was counted twice in the game-log step.</b> Stars from slow eras (2009-13) were inflated about 8% and stars from fast eras (the 1960s) deflated about 20%. Fixed: LeBron's peak 6.37 to 6.23, Wilt's 4.35 to 4.63, Russell's 3.68 to 3.92.</li>
    <li><b>The 2020 bubble was filed under the wrong season</b> (seasons were read from dates). Now read from game ids. LeBron's 2020 title is credited.</li>
    <li><b>The source had no team ids for 2021-22</b> and half of 2000-01. Rebuilt from the home/away flag. The 2022 Warriors' title is credited and held-out accuracy rose (r 0.674 to 0.677).</li>
    <li><b>Clutch now uses actual points.</b> The luck adjustment had been replacing made clutch threes and free throws with expected values. LeBron's clutch rise 3.4 to 2.8.</li></ul>
    <p>Then six objections a skeptical analyst would raise, each tested:</p><ul>
    <li><b>Team credit split evenly.</b> Tested unequal splits on held-out seasons. Stars were not being shortchanged (their ratings were unbiased), but scaling a player's share with his minutes improved accuracy, so that is now the rule (r 0.660 to 0.666; with game logs 0.685).</li>
    <li><b>"Classic squeezes the top."</b> Mostly a mirage from picking seasons by their play-by-play rating. Grouped by Classic rating, seasons at +4 and above read about 0.4 low, not 2.</li>
    <li><b>No playoffs in the all-era tier.</b> Added as its own number. Short playoff runs are pulled toward the player's own regular-season level; playoff rise repeats across a career (r 0.2 to 0.4).</li>
    <li><b>No availability.</b> Added peak wins per season, where missed games count.</li>
    <li><b>No contract value.</b> Added wins per dollar for 2009-25 on the GM finder.</li>
    <li><b>Legacy weights are a choice.</b> Every player now shows his rank range across 243 weightings.</li></ul>
    <p>Checks that now pass every run: all 75 titles fully credited, league-average rating at zero each season, league wins added matching games played, and player ratings summing to team results (r 0.98).</p></div>
  <div class="panel prose"><h3>What it can't do yet</h3><ul><li>Prime Jordan, Magic and Bird are Classic only. A with-or-without-you signal from game logs would sharpen pre-1996 defense.</li><li>"Coach" still includes the front office and the team's system.</li><li>Single seasons are noisy. Read the ± and the eras.</li></ul></div></div>`;
}
